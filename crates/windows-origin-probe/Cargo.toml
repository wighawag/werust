[package]
name = "windows-origin-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Gate 0 of the Windows work, never a shipped artifact: nothing depends on this
# crate and it is not part of any release. See `src/main.rs`.
publish = false

[dependencies]
# The probe's report, its recorded expectations and the page's own outcome
# message are all JSON, so the pure half (facts.rs) needs serde on every host —
# it is exercised by the Ubuntu `verify` gate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The WebView2 half only exists on Windows. Keeping the bindings target-gated is
# the same shape `crates/werust-android/rust` uses for `jni`: the always-on
# `cargo test` in the verify gate compiles and exercises the host-testable logic
# without ever needing the platform SDK.
[target.'cfg(windows)'.dependencies]
# ADR-0011 finding 4: `webview2-com` (wravery/webview2-rs), the bindings `wry`
# itself depends on — NEVER the abandoned `webview2` crate, which last shipped
# in 2021 and predates `ICoreWebView2CustomSchemeRegistration` entirely.
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
