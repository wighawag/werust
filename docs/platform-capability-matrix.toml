# werust platform-capability parity matrix (the checked-in source of truth for
# the `verify`-enforced parity guard; see docs/adr/0005-platform-capability-parity-guard.md).
#
# WHY THIS FILE EXISTS: werust ships three contexts (desktop WebKitGTK, iOS
# WKWebView, Android System WebView), each an OS edge over the shared
# `werust-core` seams. A cross-cutting user-facing CAPABILITY (address bar,
# back/forward, `ipfs://` render, ENS `.eth` resolution, EIP-1193 provider,
# trust indicator) can silently ship on ONE platform only when a seam method is
# no-op'd on a backend and nothing flags it. That is exactly what hid the mobile
# `ipfs://` gap: `register_scheme_handler` was an empty `{}` on both mobile
# backends, the whole capability shipped desktop-only, and the release looked
# green.
#
# THE RULE (enforced by crates/werust-core/tests/platform_capability_parity.rs,
# a plain workspace `cargo test` that rides the existing `verify` gate):
#
#   For EVERY capability x EVERY platform in `platforms`, there MUST be an
#   explicit cell state, one of:
#     * "implemented"          — the capability is really wired on that platform.
#     * "stubbed"              — a KNOWN gap; REQUIRES `task = "<slug>"` naming a
#                                follow-on task that exists in
#                                work/tasks/{backlog,ready,done}/ and covers its
#                                completion. A `stubbed` cell with no resolvable
#                                task REDS THE GATE (the whole point).
#     * "n-a"                  — genuinely not applicable on that platform;
#                                REQUIRES `reason = "..."`.
#
#   A MISSING cell (a capability that does not list every platform, or a
#   platform not covered by a row) REDS THE GATE too: adding a capability or a
#   platform FORCES a cell, so a gap can never be silent-by-omission.
#
# HOW TO ADD A CAPABILITY: add a `[[capability]]` block with a cell for EVERY
# platform below. HOW TO ADD A PLATFORM: add it to `platforms` and add a cell
# for it to EVERY existing capability. Either way the guard forces the cells.

# The shipped contexts. Adding one here forces a cell in every capability row.
platforms = ["desktop", "ios", "android"]

# ---------------------------------------------------------------------------
# Capabilities, seeded with CURRENT REALITY (2026-07-23). The guard passes today
# ONLY because the known gaps are tracked (linked to a real task), not hidden.
# ---------------------------------------------------------------------------

[[capability]]
name = "address-bar"
description = "URL bar: type/commit a URL, reflect the current URL in the chrome."
# Core logic (BrowserShell) driven through the seam; each backend implements
# navigate + current_url. Verified on all three.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "back-forward"
description = "Session history: go_back / go_forward and their availability."
# Each backend owns its session-history truth (webview-renderer, IosBackend,
# AndroidBackend all implement go_back/go_forward/can_go_*).
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "ens-eth-resolution"
description = "Bare `.eth` URL-bar entry resolved namehash -> resolver -> contenthash (ENS)."
# Toolkit-free core logic in `werust-core` (ens/contenthash/ethereum modules),
# driven by the shell regardless of backend, so it is available on every edge.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "ipfs-render"
description = "Intercept `ipfs://<cid>` and render hash-verified content through the shared core resolve path."
# Desktop intercepts via WebKitGTK `install_ipfs` (register_uri_scheme). Both
# mobile backends now intercept too (task
# mobile-ipfs-scheme-interception-ios-and-android): `register_scheme_handler` is
# REAL (the mobile `CoreSession`'s `install_ipfs` registers the `ipfs` handler
# routing through the SAME `werust_core::ipfs::resolve_ipfs_request` path), and
# the OS edge dispatches it — Android via `WebViewClient.shouldInterceptRequest`,
# iOS via a `WKURLSchemeHandler` for `ipfs`. The former silent no-op is gone.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "retrieval-backend"
description = "User-choosable IPFS retrieval backend: pick the default trustless gateway or a custom gateway/local-node URL (via `werust://settings`), persisted and switching the actual `ipfs://` load path."
# The selector + persistence + the `werust://settings` page + the custom-URL
# validation all live in the SHARED toolkit-free core
# (`werust-core::retrieval`), and each backend's `install_ipfs` builds its
# `TrustlessGatewayCarRetriever` from the persisted choice and registers the
# `werust` scheme through the SAME scheme-handler seam as `ipfs://`. So the
# capability is wired on every context at the same level `ipfs-render` is:
# desktop via `context.register_uri_scheme(WERUST_SCHEME, …)`, both mobile edges
# via `register_scheme_handler(WERUST_SCHEME, …)` dispatched by the OS edge —
# Android via `WebViewClient.shouldInterceptRequest` (its generic
# `WerustCore.resolveIpfs` dispatches ANY registered scheme, so `werust://`
# reaches the handler), iOS via an EXPLICIT `WKURLSchemeHandler` for `werust`
# (`configuration.setURLSchemeHandler(WerustSchemeHandler…, forURLScheme:
# "werust")` in WKWebViewShellController.swift, routing through the
# `werust_ios_apply_settings` FFI into the shared core) — the same mechanism the
# mobile `ipfs://` interception uses (which required its own explicit iOS
# `setURLSchemeHandler(forURLScheme: "ipfs")`). WKWebView will not hand an
# unregistered custom scheme to any handler, so this per-scheme iOS registration
# is what makes `werust://settings` actually reachable there (the requeue's Gate-2
# fix; before it the `werust` scheme was registered Rust-side but dead on iOS).
# Task `retrieval-backend-user-setting`.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "eip1193-provider"
description = "Inject the native EIP-1193 provider into pages via the script-message bridge."
# Desktop wires it via `install_provider` (register_script_message_handler +
# inject_script + response push). Both mobile backends now wire it too (task
# mobile-provider-injection-and-trust-indicator): their `register_script_message_handler`
# + `inject_script` no-ops are GONE (they store the handler + document-start
# script), each mobile `CoreSession`'s `install_provider` registers the
# `werustProvider` channel + injects the SAME `werust_core::provider` shim desktop
# uses, and the OS edge drives the round-trip — Android via `addJavascriptInterface`
# + `WebView.evaluateJavascript`, iOS via a `WKScriptMessageHandler` +
# `WKWebView.evaluateJavaScript`. So a page's `window.ethereum` works on mobile
# through the SAME keyless read-only path desktop uses. The former silent no-op is
# gone.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "follow-os-color-scheme"
description = "Follow the OS light/dark setting so `prefers-color-scheme` and UA-styled controls match the user's OS preference (never force dark, never override a page's declared `color-scheme`)."
# Each OS edge follows its platform's OS color-scheme signal through the SAME
# cross-platform `renderer::OsColorScheme` rule (follow, never force). Desktop:
# `WebViewRenderer::follow_os_color_scheme` reads the XDG desktop portal
# (`org.freedesktop.appearance color-scheme`) and sets
# `gtk-application-prefer-dark-theme` to match, the flag WebKitGTK ties
# `prefers-color-scheme` to (WebKit changeset 255342), tracking live changes.
# Android: the app theme `Theme.Werust` has a light variant (res/values) + a
# night variant (res/values-night) selected by the OS `UI_MODE_NIGHT` qualifier,
# and the System WebView sets `prefers-color-scheme` from the theme's
# `isLightTheme` — so it follows the OS (no force-dark / algorithmic darkening).
# iOS: WKWebView reports `prefers-color-scheme` from `userInterfaceStyle`, which
# follows the OS by default; the app pins no `UIUserInterfaceStyle` and leaves
# `overrideUserInterfaceStyle == .unspecified`, so it follows the OS without
# forcing. Task `webview-follow-os-color-scheme`, `docs/adr/0009`.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "trust-indicator"
description = "Surface the load's trust posture (content-verified / name-via-trusted-rpc / mutable-name / unverified) in the chrome, showing a NEUTRAL loading state (no trust claim) while a load is in flight so a stale/previous posture never lingers into a new load."
# Desktop reads the shared LoadLifecycle posture (marked by the `ipfs://` scheme
# handler / ENS front door). Both mobile backends now surface it too (task
# mobile-provider-injection-and-trust-indicator): their `Inner` tracks the same
# two trust axes (reset on `begin`, `mark_content_verified` on a verified `ipfs`
# resolve, `mark_ens_origin` / `mark_mutable_name` from the front door) and reports
# the honest posture through the seam's `trust_posture` via the ONE shared
# `TrustPosture::after_verify` rule desktop uses — so the seam-DEFAULT
# `UnverifiedOrigin` is no longer inherited. The chrome JSON carries `trustPosture`
# and the mobile chrome paints the indicator (content-verified / name-via-trusted-rpc
# / mutable-name / unverified) from it, matching desktop for the same load.
# While a load is in flight the indicator is a NEUTRAL loading state on every
# platform (task chrome-loading-state-resets-trust-indicator): each chrome applies
# the SAME loading-wins rule over the posture from the SAME `loading` fact —
# desktop `trust_indicator`/`_detail`/`_css_class` in crates/werust/src/main.rs,
# and the mobile `Chrome.trustIndicator()` (Kotlin WerustCore.kt, Swift
# WerustCore.swift) reading the `loading` field of the chrome JSON — so the prior
# page's trust posture never lingers while a new, possibly differently-trusted
# page loads.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }
