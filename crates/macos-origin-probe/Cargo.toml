[package]
name = "macos-origin-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The macOS analogue of `crates/windows-origin-probe`: a MEASUREMENT, never a
# shipped artifact. Nothing depends on this crate and it is not part of any
# release. See `src/lib.rs`.
publish = false

[dependencies]
# The report, its recorded expectations and the page's own outcome message are
# all JSON, so the pure half (facts.rs) needs serde on every host -- it is
# exercised by the Ubuntu `verify` gate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The WKWebView half only exists on macOS, exactly as the Windows probe gates
# `webview2-com` behind `cfg(windows)`: the always-on `cargo test` in the verify
# gate compiles and exercises the host-testable logic (the decision rule, the
# canned site, the CLI) without ever needing a Mac.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSObjCRuntime",
  "NSProcessInfo",
  "NSRunLoop",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSURLResponse",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSGraphics",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationDelegate",
  "WKPreferences",
  "WKScriptMessage",
  "WKScriptMessageHandler",
  "WKURLSchemeHandler",
  "WKURLSchemeTask",
  "WKUserContentController",
  "WKWebView",
  "WKWebViewConfiguration",
] }
