[[capability]]
name = "ipfs-redirects-3xx-navigation"
description = "Follow a site's `_redirects` 3xx rule (301/302/303/307/308, IPIP-0002) as a real NAVIGATION to the rule's `to` target under the SAME root CID: the URL bar and history move, the target is hash-verified by the retrieval that navigation triggers, only the MAIN-FRAME document redirects (a sub-resource never navigates the page away), and the chain is bounded PER CHAIN so a cycle fails closed."
# DISTINCT from `ipfs-web-pathing-fallback` above (which SERVES a target in place,
# leaving the bar untouched) precisely because a 3xx changes the page's identity.
# The decision + the bound are SHARED core: `werust-core`'s `redirects` module
# yields `FallbackAction::Redirect`, `werust_core::ipfs::resolve_ipfs_request`
# turns it into an absolute `ipfs://<rootcid><to>` pushed into the shared
# `RedirectSink` (which counts hops and refuses a cycle / an over-long chain), and
# `BrowserShell::pump` drains the sink and navigates through the SEAM. So every
# context gets identical rules, identical same-root confinement, and identical
# verification. What each edge adds is only OWNING the sink and letting the
# navigation reach its webview: desktop's `install_ipfs` returns the sink and
# `main.rs` hands it to the shell via `with_redirect_sink` (crates/werust,
# crates/webview-renderer); Android and iOS do the same in their `CoreSession::new`
# and drain the resulting pending load on their existing load-signal path
# (`afterCoreAction` in BrowserActivity.kt / WKWebViewShellController.swift). That
# same load-signal path is ALSO what keeps the chain bound per-chain and the
# main-frame check current on every context: reporting a load event into the core
# runs `BrowserShell::pump`, which tells the sink the new TOP-LEVEL document URL
# (`RedirectSink::note_navigation`) — the only signal an in-page LINK CLICK gives
# the core at all. Which
# is ALSO why no edge tries to return a 3xx status from its interception hook
# (Android's `WebResourceResponse` refuses a 300-399 status outright, and a status
# on `SchemeResponse` is explicitly not a redirect channel). Task
# `ipfs-redirects-3xx-navigation-support`.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "debug-capture-console-and-network"
description = "CAPTURE the page's console messages and network requests into werust's ONE shared bounded store (`werust_core::debug::DebugCapture`), always-on, so the in-app debug menu's Console and Network tabs have real content on every platform. Each network entry carries the HONEST per-request trust posture (ADR-0006) and the main-document entry mirrors the load's own posture, so the Network tab can never contradict the chrome trust indicator. Capture is READ-ONLY observation: it does not alter the load path, the `ipfs://` verification, or the posture."
# This row is for the CAPTURE POINTS, not for the tabbed debug VIEW that renders
# them (the follow-on `debug-view-console-network-tabs-{desktop,mobile}`), and not
# for the Phase-2 capture toggle. The store itself is shared, toolkit-free core
# (`crates/werust-core/src/debug.rs`), which also owns the two INJECTED page-side
# shims, the envelope parse, and the platform-event -> core-entry mapping — so the
# vocabulary (`ConsoleLevel::from_platform`) and the trust rule
# (`request_trust_posture`) are derived in ONE place and no edge forks them.
#
# What each edge adds is only its own platform hooks. The console MECHANISM
# differs on purpose: desktop and iOS inject the SAME shared shim because neither
# WebKitGTK 6 (no console signal on `WebView` in the pinned webkit6 binding) nor
# WKWebView exposes a console callback, while Android uses its REAL native
# `WebChromeClient.onConsoleMessage` — strictly better (exact level/source/line,
# sees engine-emitted output, unwrappable by no page). Network reach likewise
# differs by what each platform exposes, and this is the asymmetry the guard
# exists to surface:
#   * desktop  — `WebView::connect_resource_load_started`, pushing ONE row per
#                resource from `finished` (its `failed` handler only FLAGS the
#                outcome, because WebKit emits failed AND THEN finished for the
#                same resource) (`install_debug_capture` in
#                crates/webview-renderer/src/backend.rs, wired from
#                crates/werust/src/main.rs). Sees EVERY resource, https included,
#                which the ipfs:// scheme handler never does.
#   * android  — the existing `shouldInterceptRequest`, recording BOTH the
#                intercepted (ipfs://) and the passed-through (return-null)
#                requests (BrowserActivity.kt over WerustCore.kt ->
#                crates/werust-android/rust). Widest reach: that hook sees every
#                request.
#   * ios      — the reachable points ONLY: both WKURLSchemeHandlers, the
#                WKNavigationDelegate main-frame navigation, and a best-effort
#                fetch/XHR shim (install_debug_capture in
#                crates/werust-ios/rust/src/lib.rs; DebugCaptureHandler in
#                WKWebViewShellController.swift). It does NOT see browser-internal
#                subresource loads (<img>/<script>/CSS url()/preloads) — WKWebView
#                exposes no per-resource callback. That coverage limit is ACCEPTED
#                by the spec's Out of Scope and recorded honestly in
#                docs/spikes/debug-console-network-capture-per-platform/DECISIONS.md
#                (Decision 3), so `implemented` here means "the capture points this
#                platform CAN wire are wired", not "identical reach".
# WHICH row is the main document (the one that takes the load's own two-axis
# posture) comes from the codebase's ONE main-frame predicate on desktop and iOS
# — `BrowserShell::is_main_frame` over the `_redirects` sink, driven by the
# top-level URL the shell reports on every navigation — never a per-edge URL
# compare. Android is the one platform with a NATIVE answer
# (`WebResourceRequest.isForMainFrame`) and uses it. See DECISIONS.md Decision 5.
# Capture runs where the platform event already runs and does only a bounded
# ring-buffer insert; on Android it pushes through a CLONED DebugCapture handle
# and NEVER the session lock, because `onConsoleMessage` is on the UI thread while
# `resolve_ipfs` can hold that lock for seconds during a CAR retrieval — the ANR
# shape docs/adr/0008 and the spec's user story 4 forbid.
# The runtime-only Kotlin/Swift wiring (which the pure-Rust gate never compiles)
# is guarded source-shape-wise by
# crates/werust-core/tests/debug_capture_edge_wiring_shape.rs, and the live capture
# carries recorded manual steps at
# docs/spikes/debug-console-network-capture-per-platform/README.md.
# Task `debug-console-network-capture-per-platform`, spec
# `in-app-debug-menu-console-and-network`.
desktop = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }
