name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned Rust toolchain
        # NOT `rustup component add rustfmt clippy` any more, and never again:
        # that took whatever compiler the runner shipped (1.97.0) while the
        # local `verify` gate — this repo's actual acceptance bar — was on
        # 1.91.1, so a change could go green locally and red HERE on a lint the
        # gate could not see (run 30622910777). `rust-toolchain.toml` at the
        # workspace root now pins the channel AND the rustfmt/clippy components,
        # and rustup installs it on the first proxied `cargo`/`rustup target add`
        # call, so this step only RESOLVES and RECORDS it: a run's verdict is
        # not a verdict without the compiler that reached it.
        # `crates/werust-core/tests/toolchain_pin_shape.rs` reds if any leg
        # re-selects a toolchain.
        run: |
          rustup show active-toolchain
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The verify gate builds the WHOLE workspace, including webview-renderer +
      # the werust desktop binary, which link webkit6/gtk4/glib via pkg-config.
      # A bare ubuntu-latest runner has none of those .pc files, so `cargo build`
      # fails with `glib-2.0 not found`. libwebkitgtk-6.0-dev owns
      # webkitgtk-6.0.pc and pulls in libgtk-4-dev (gtk4.pc) + libglib2.0-dev
      # (glib-2.0.pc, gio-2.0.pc) + libjavascriptcoregtk-6.0-dev as dependencies —
      # the full set webkit6/gtk4/glib-sys/javascriptcore6 need. Must run BEFORE
      # the compile steps (cargo clippy/build/test).
      - name: Install WebKitGTK/GTK4 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwebkitgtk-6.0-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The verify gate, identical to dorfl.json's `verify`, step for step
      # (`crates/werust-core/tests/verify_gate_shape.rs` reds if the two drift).
      - name: cargo fmt --check
        run: cargo fmt --check

      # `--all-targets` so `#[cfg(test)]` modules, integration tests and the
      # load-bearing `examples/` are linted, not just lib/bin targets; `-D
      # warnings` because `cargo clippy` EXITS 0 on warnings, so without it the
      # lint half of the gate only prints. See
      # `docs/spikes/verify-lints-test-targets-and-clears-the-existing-debt/`
      # for what this covers and what it (still) cannot.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test
