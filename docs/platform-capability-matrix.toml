# werust platform-capability parity matrix (the checked-in source of truth for
# the `verify`-enforced parity guard; see docs/adr/0005-platform-capability-parity-guard.md).
#
# WHY THIS FILE EXISTS: werust ships several contexts (`desktop` = the Linux
# WebKitGTK shell, `macos` = the AppKit + WKWebView shell, iOS WKWebView,
# Android System WebView), each an OS edge over the shared
# `werust-core` seams. A cross-cutting user-facing CAPABILITY (address bar,
# back/forward, `ipfs://` render, ENS `.eth` resolution, EIP-1193 provider,
# trust indicator) can silently ship on ONE platform only when a seam method is
# no-op'd on a backend and nothing flags it. That is exactly what hid the mobile
# `ipfs://` gap: `register_scheme_handler` was an empty `{}` on both mobile
# backends, the whole capability shipped desktop-only, and the release looked
# green.
#
# THE RULE (enforced by crates/werust-core/tests/platform_capability_parity.rs,
# a plain workspace `cargo test` that rides the existing `verify` gate):
#
#   For EVERY capability x EVERY platform in `platforms`, there MUST be an
#   explicit cell state, one of:
#     * "implemented"          — the capability is really wired on that platform.
#     * "stubbed"              — a KNOWN gap; REQUIRES `task = "<slug>"` naming a
#                                follow-on task that exists in
#                                work/tasks/{backlog,ready,done}/ and covers its
#                                completion. A `stubbed` cell with no resolvable
#                                task REDS THE GATE (the whole point).
#     * "n-a"                  — genuinely not applicable on that platform;
#                                REQUIRES `reason = "..."`.
#
#   A MISSING cell (a capability that does not list every platform, or a
#   platform not covered by a row) REDS THE GATE too: adding a capability or a
#   platform FORCES a cell, so a gap can never be silent-by-omission.
#
# HOW TO ADD A CAPABILITY: add a `[[capability]]` block with a cell for EVERY
# platform below. HOW TO ADD A PLATFORM: add it to `platforms` and add a cell
# for it to EVERY existing capability. Either way the guard forces the cells.

# The shipped contexts. Adding one here forces a cell in every capability row.
#
# `desktop` is the LINUX GTK/WebKitGTK shell specifically (the name predates a
# second desktop edge; `macos` sits beside it rather than under it). A rename to
# `linux` would touch this file, the guard's expected list, ADR-0005 and the
# pending `windows` column, so it is left to a human: see
# work/notes/observations/desktop-platform-key-now-means-linux-only-2026-07-31.md.
platforms = ["desktop", "macos", "ios", "android"]

# ---------------------------------------------------------------------------
# Capabilities, seeded with CURRENT REALITY (2026-07-23). The guard passes today
# ONLY because the known gaps are tracked (linked to a real task), not hidden.
# ---------------------------------------------------------------------------

[[capability]]
name = "address-bar"
description = "URL bar: type/commit a URL, reflect the current URL in the chrome."
# Core logic (BrowserShell) driven through the seam; each backend implements
# navigate + current_url. Verified on all three of those edges.
# macOS: the AppKit `NSTextField` URL bar paints `ChromeState::url_text` through
# the shared `desktop-paint` snapshot and commits the RAW typed text to
# `BrowserShell::navigate` (`urlCommitted:` in crates/werust-macos/src/window.rs),
# over `MacosRenderer`'s `navigate` + `current_url`. READ BACK OUT OF THE REAL
# WIDGET on a macos-14 runner by `crates/werust-macos/examples/window_smoke.rs`
# (run 30572253620): after a hash-verified load the bar holds the loaded
# content-addressed URL. Task `macos-appkit-window-and-chrome`.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "spa-url-tracking"
description = "Track a SAME-DOCUMENT (SPA client-side) URL change — a SvelteKit `pushState`/`replaceState` navigation that fires NO page load — so the URL bar FOLLOWS the new location (dropping a pinned `.eth` name / re-deriving an ENS identity) instead of freezing, modelled as a distinct `LoadEvent::UrlChanged` (never a faked load lifecycle, no trust re-mean)."
# The shell logic (drop-pin/follow + root-CID-prefix ENS re-derive) is the SHARED
# toolkit-free core (`werust-core`'s `pump` handling of `LoadEvent::UrlChanged` +
# `ens_identity_for_url`), so it is available on every context. Each platform
# wires its OWN native SAME-DOCUMENT URL observation (distinct from a load
# lifecycle signal) that feeds the seam `UrlChanged`: desktop
# `WebViewRenderer::connect_load_signals` observes WebKitGTK's `notify::uri`
# (which fires on same-document history changes) and drives the shared
# `LoadLifecycle::url_changed`; Android's `CoreWebViewClient.doUpdateVisitedHistory`
# calls `WerustCore.onUrlChanged` -> `AndroidHandle::on_url_changed`; iOS observes
# `webView.url` via KVO (`urlObservation`) and calls `WerustCore.onUrlChanged` ->
# `IosHandle::on_url_changed`. All three emit ONLY `UrlChanged` (no load-state /
# posture change), so a same-document nav within a verified site keeps its posture.
# Task `track-webview-url-on-spa-clientside-navigation`.
# macOS observes the SAME same-document signal iOS does, through the same WebKit
# API: `NavigationBridge` KVO-observes `WKWebView.URL`
# (`observeValueForKeyPath:` in crates/macos-renderer/src/backend.rs) and drives
# the shared `LoadLifecycle::url_changed`, which is a no-op when the URL already
# matches a real load — so only a genuine same-document change surfaces
# `UrlChanged`, and it moves neither the load state nor the posture. The
# observation COMPILES and registers on macOS (macos-renderer CI leg), but no CI
# step performs a `pushState`, so the macOS evidence is compilation + the
# source-shape guard over the shared rule, not a driven SPA navigation.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "back-forward"
description = "Session history: go_back / go_forward and their availability."
# Each backend owns its session-history truth (webview-renderer, IosBackend,
# AndroidBackend all implement go_back/go_forward/can_go_*).
# macOS: `MacosRenderer` implements go_back/go_forward/can_go_* over
# `WKWebView`'s own back-forward list, and the AppKit ◀ / ▶ buttons take their
# enabled state from `ChromeState::can_go_back` / `_forward` through the shared
# paint snapshot — the same one fact the on-screen control everywhere else reads.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "system-back-navigates-history"
description = "The OS-provided SYSTEM Back affordance (a hardware/gesture Back the OS itself routes to the app) navigates BACK ONE PAGE in session history when there IS back history \u2014 the SAME action the on-screen Back control drives \u2014 and only falls through to the platform default (leave/exit the app) when there is none."
# The affordance itself is ANDROID-ONLY: only Android gives the OS a Back button/
# gesture that is delivered to the app and, unhandled, finishes the Activity.
# Where it exists, it must read the SAME core fact the on-screen control does
# (`ChromeState::can_go_back`) and drive the SAME core action (`go_back`), so the
# two Back affordances can never disagree — that lockstep is what this row pins.
# Android: `BrowserActivity` registers an AndroidX `OnBackPressedCallback` on the
# Activity's `onBackPressedDispatcher` (the non-deprecated API; the deprecated
# `onBackPressed()` override and raw KEYCODE_BACK interception are NOT used); its
# `isEnabled` is set from `chrome.canGoBack` in `refreshChrome`, right where
# `backButton.isEnabled` is, and `handleOnBackPressed` runs the SAME
# `driveCore { core.goBack() }` the on-screen `◀` does — off the UI thread, so the
# ANR fix (task `android-anr-main-thread-diagnose-and-unblock`) is not regressed.
# Disabled means the platform default runs, so Back at the start of history exits
# the app as a normal browser does. The edge wiring is runtime-only (a live
# Activity) and the Gradle/Kotlin build is not in the gate either, so its ONLY
# gate-side cover is the source-shape test
# `crates/werust-android/rust/tests/system_back_wiring_shape.rs` (in the pure-Rust
# `verify` gate), whose handler assertion is brace-bounded to
# `handleOnBackPressed`'s own body and was re-checked by mutation (emptying the
# handler, an inline UI-thread core call, an extra core call beside the dispatch,
# or a removed/relocated lockstep line each turn it red). Alongside it sit the
# headless `can_go_back` assertion of the fact the edge reads, and device steps
# that were EXECUTED and PASSED on an API-36 emulator (navigates with history,
# exits without, lockstep with the on-screen control, same for the gesture-nav
# edge swipe), recorded at
# docs/spikes/android-hardware-back-button-navigates-history/README.md. Task
# `android-hardware-back-button-navigates-history`, field finding v0.2.5.
# Desktop/iOS are `n-a` because neither platform HAS this affordance: a GTK window
# has no OS Back button (its Back is the on-screen control, covered by
# `back-forward`), and iOS has no hardware Back button either — its platform
# analogue is the WKWebView edge-swipe back GESTURE, a different affordance with
# its own enablement (`allowsBackForwardNavigationGestures`), noted as a separate
# signal in work/notes/observations/ios-edge-swipe-back-gesture-not-enabled-2026-07-26.md
# rather than folded into this row.
desktop = { state = "n-a", reason = "a GTK desktop window has no OS-level system Back button/gesture the app must handle; desktop Back is the on-screen control (capability `back-forward`)" }
macos = { state = "n-a", reason = "a macOS window has no OS-level system Back button/gesture the app must handle (nothing routes Back to the app, and nothing exits it); macOS Back is the on-screen control, capability `back-forward`. Its platform analogue is the WKWebView two-finger swipe-back gesture, a distinct affordance with its own enablement (`allowsBackForwardNavigationGestures`), tracked separately in work/notes/observations/macos-swipe-back-gesture-not-enabled-2026-07-31.md" }
ios = { state = "n-a", reason = "iOS has no hardware/system Back button delivered to the app; its platform analogue is the WKWebView edge-swipe back gesture, a distinct affordance tracked separately (see work/notes/observations/ios-edge-swipe-back-gesture-not-enabled-2026-07-26.md)" }
android = { state = "implemented" }

[[capability]]
name = "ens-eth-resolution"
description = "Bare `.eth` URL-bar entry resolved namehash -> resolver -> contenthash (ENS)."
# Toolkit-free core logic in `werust-core` (ens/contenthash/ethereum modules),
# driven by the shell regardless of backend, so it is available on every edge.
# macOS adds NOTHING here and needs to: the AppKit window hands the raw entry to
# the same `BrowserShell`, which owns the RPC provider and the namehash ->
# resolver -> contenthash path. Same basis as the iOS/Android cells (the shared
# core, exercised by its own tests on every gate); no macOS CI step resolves a
# real name, because the macos-14 smokes are deliberately offline.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "ipfs-render"
description = "Intercept `ipfs://<cid>` and render hash-verified content through the shared core resolve path."
# Desktop intercepts via WebKitGTK `install_ipfs` (register_uri_scheme). Both
# mobile backends now intercept too (task
# mobile-ipfs-scheme-interception-ios-and-android): `register_scheme_handler` is
# REAL (the mobile `CoreSession`'s `install_ipfs` registers the `ipfs` handler
# routing through the SAME `werust_core::ipfs::resolve_ipfs_request` path), and
# the OS edge dispatches it — Android via `WebViewClient.shouldInterceptRequest`,
# iOS via a `WKURLSchemeHandler` for `ipfs`. The former silent no-op is gone.
# macOS intercepts through the same WebKit class iOS does: `MacosRenderer::install_ipfs`
# registers a `WKURLSchemeHandler` for `ipfs` that routes through the SAME
# `werust_core::ipfs::resolve_ipfs_request` + verifying `fetcher` path, across the
# shared ADR-0008 off-thread boundary (`webview-shared`). MEASURED on a macos-14
# runner, not argued: `macos-renderer`'s `trust_hooks_smoke` loaded a pinned
# in-memory page through the production verifying route and reported
# `TrustPosture::ContentVerified`, while the negative control (bytes that do not
# hash to their CID) ended `Failed` / `UnverifiedOrigin` (run 30563185521); the
# sibling `macos-origin-probe` measured that a handler-served document really
# gets an `ipfs://<cid>` tuple origin, with its own negative control failing in
# the same process (docs/spikes/macos-wkwebview-renderer-backend/README.md).
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "retrieval-backend"
description = "User-choosable IPFS retrieval backend: pick the default trustless gateway or a custom gateway/local-node URL (via `werust://settings`), persisted and switching the actual `ipfs://` load path."
# The selector + persistence + the `werust://settings` page + the custom-URL
# validation all live in the SHARED toolkit-free core
# (`werust-core::retrieval`), and each backend's `install_ipfs` builds its
# `TrustlessGatewayCarRetriever` from the persisted choice and registers the
# `werust` scheme through the SAME scheme-handler seam as `ipfs://`. So the
# capability is wired on every context at the same level `ipfs-render` is:
# desktop via `context.register_uri_scheme(WERUST_SCHEME, …)`, both mobile edges
# via `register_scheme_handler(WERUST_SCHEME, …)` dispatched by the OS edge —
# Android via `WebViewClient.shouldInterceptRequest` (its generic
# `WerustCore.resolveIpfs` dispatches ANY registered scheme, so `werust://`
# reaches the handler), iOS via an EXPLICIT `WKURLSchemeHandler` for `werust`
# (`configuration.setURLSchemeHandler(WerustSchemeHandler…, forURLScheme:
# "werust")` in WKWebViewShellController.swift, routing through the
# `werust_ios_apply_settings` FFI into the shared core) — the same mechanism the
# mobile `ipfs://` interception uses (which required its own explicit iOS
# `setURLSchemeHandler(forURLScheme: "ipfs")`). WKWebView will not hand an
# unregistered custom scheme to any handler, so this per-scheme iOS registration
# is what makes `werust://settings` actually reachable there (the requeue's Gate-2
# fix; before it the `werust` scheme was registered Rust-side but dead on iOS).
# Task `retrieval-backend-user-setting`.
# macOS pays that same WebKit price and pays it in the same place:
# `MacosRenderer::install_ipfs` builds its `TrustlessGatewayCarRetriever` from the
# persisted `retrieval::active_gateway_endpoint()` and registers the `werust`
# scheme through its OWN `WKURLSchemeHandler` beside `ipfs` (routing to
# `retrieval::apply_settings_request`), before the first navigation — the
# `WKWebViewConfiguration` is copied when the `WKWebView` is constructed, so a
# later registration is refused and reported. The selector, the persistence and
# the page are the shared core, unchanged. HONEST LIMIT: nothing has LOADED
# `werust://settings` on a Mac — the macos-14 smokes drive `ipfs://` only — so the
# macOS evidence is the registration + the shared core's own tests, not a driven
# settings page (docs/spikes/macos-wkwebview-renderer-backend/README.md, "the
# `werust://settings` internal page ... wired but not driven").
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "eip1193-provider"
description = "Inject the native EIP-1193 provider into pages via the script-message bridge."
# Desktop wires it via `install_provider` (register_script_message_handler +
# inject_script + response push). Both mobile backends now wire it too (task
# mobile-provider-injection-and-trust-indicator): their `register_script_message_handler`
# + `inject_script` no-ops are GONE (they store the handler + document-start
# script), each mobile `CoreSession`'s `install_provider` registers the
# `werustProvider` channel + injects the SAME `werust_core::provider` shim desktop
# uses, and the OS edge drives the round-trip — Android via `addJavascriptInterface`
# + `WebView.evaluateJavascript`, iOS via a `WKScriptMessageHandler` +
# `WKWebView.evaluateJavaScript`. So a page's `window.ethereum` works on mobile
# through the SAME keyless read-only path desktop uses. The former silent no-op is
# gone.
# macOS: `MacosRenderer::install_provider` registers the `PROVIDER_BRIDGE`
# script-message channel and injects the SAME `werust_core::provider` shim at
# document start, pushing each answer back into the live page by evaluating the
# settle-call JS (a `Send` queue drained on the main thread, the iOS shape).
# MEASURED on a macos-14 runner (run 30563185521): the page reported
# `window.ethereum` as an object and `request({ method: 'eth_chainId' })` resolved
# to `0x1`, which can only happen if the page -> native -> page round trip
# completed. Keyless and read-only, like every other edge.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "follow-os-color-scheme"
description = "Follow the OS light/dark setting so `prefers-color-scheme` and UA-styled controls match the user's OS preference (never force dark, never override a page's declared `color-scheme`)."
# Each OS edge follows its platform's OS color-scheme signal through the SAME
# cross-platform `renderer::OsColorScheme` rule (follow, never force). Desktop:
# `WebViewRenderer::follow_os_color_scheme` reads the XDG desktop portal
# (`org.freedesktop.appearance color-scheme`) and sets
# `gtk-application-prefer-dark-theme` to match, the flag WebKitGTK ties
# `prefers-color-scheme` to (WebKit changeset 255342), tracking live changes.
# Android: the app theme `Theme.Werust` has a light variant (res/values) + a
# night variant (res/values-night) selected by the OS `UI_MODE_NIGHT` qualifier,
# and the System WebView sets `prefers-color-scheme` from the theme's
# `isLightTheme` — so it follows the OS (no force-dark / algorithmic darkening).
# iOS: WKWebView reports `prefers-color-scheme` from `userInterfaceStyle`, which
# follows the OS by default; the app pins no `UIUserInterfaceStyle` and leaves
# `overrideUserInterfaceStyle == .unspecified`, so it follows the OS without
# forcing. Task `webview-follow-os-color-scheme`, `docs/adr/0009`.
# macOS is the edge where following costs NOTHING and is done by NOT acting:
# AppKit propagates the user's effective `NSAppearance` into both the chrome and
# the `WKWebView`'s web process, so `prefers-color-scheme` already matches the OS
# (the GTK edge must set `gtk-application-prefer-dark-theme` precisely because GTK
# does not inherit it). Marked implemented on the same basis as the iOS cell (the
# platform follows by default and werust pins nothing), and the ABSENCE is
# ENFORCED rather than assumed: `crates/werust-macos/tests/macos_window_shape.rs`
# reds the Ubuntu gate if any `NSAppearance` is ever set on a window, view or
# webview, and `MacosRenderer::os_color_scheme` reads `effectiveAppearance`
# through the SAME shared `renderer::OsColorScheme` rule the other edges use.
# HONEST LIMIT: no CI runner has a display, so nobody has yet WATCHED the chrome
# and a `prefers-color-scheme` page follow a live Light/Dark switch — that is
# manual step 8 of docs/spikes/macos-appkit-window-and-chrome/README.md.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "trust-indicator"
description = "Surface the load's trust posture (content-verified / name-via-trusted-rpc / mutable-name / unverified) in the chrome, showing a NEUTRAL loading state (no trust claim) while a load is in flight so a stale/previous posture never lingers into a new load."
# Desktop reads the shared LoadLifecycle posture (marked by the `ipfs://` scheme
# handler / ENS front door). Both mobile backends now surface it too (task
# mobile-provider-injection-and-trust-indicator): their `Inner` tracks the same
# two trust axes (reset on `begin`, `mark_content_verified` on a verified `ipfs`
# resolve, `mark_ens_origin` / `mark_mutable_name` from the front door) and reports
# the honest posture through the seam's `trust_posture` via the ONE shared
# `TrustPosture::after_verify` rule desktop uses — so the seam-DEFAULT
# `UnverifiedOrigin` is no longer inherited. The chrome JSON carries `trustPosture`
# and the mobile chrome paints the indicator (content-verified / name-via-trusted-rpc
# / mutable-name / unverified) from it, matching desktop for the same load.
# While a load is in flight the indicator is a NEUTRAL loading state on every
# platform (task chrome-loading-state-resets-trust-indicator): each chrome applies
# the SAME loading-wins rule over the posture from the SAME `loading` fact —
# desktop `trust_indicator`/`_detail`/`_css_class` in werust-core (painted by
# crates/werust/src/main.rs),
# and the mobile `Chrome.trustIndicator` field (Kotlin WerustCore.kt, Swift
# WerustCore.swift), which is the core's `trust_indicator` CARRIED on the chrome
# JSON, so the prior page's trust posture never lingers while a new, possibly
# differently-trusted page loads. Both mobile edges used to RE-DERIVE that badge
# from the `loading` + `trustPosture` facts in Kotlin/Swift; task
# `mobile-chrome-presentation-from-one-derivation` collapsed those twins onto the
# one shared derivation, so a fifth posture now reaches every platform with no
# per-edge change (and cannot fall through a mobile `else` to "unverified").
# macOS paints the indicator from the SAME derivation, never a second one: the
# label, its tooltip and its colour come from `trust_indicator` /
# `_detail` / `_css_class` through the shared `desktop-paint` snapshot (unit-tested
# against the real core on the Ubuntu gate across seven chrome states, including
# the neutral loading state that wins over any posture), and the AppKit layer only
# assigns them. MEASURED on a macos-14 runner (run 30572253620): read back out of
# the real `NSTextField`, a fresh window showed the core's badge with the core's
# ADR-0006 explanation as its tooltip, a hash-verified `ipfs://` page read as
# verified, and the tampered control was never reported verified.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "trust-explanation"
description = "EXPLAIN what the current trust posture MEANS, not just which badge it is: the sentence behind `✓ verified` / `◈ name via trusted RPC` / `◇ content verified, mutable name` / `⚠ unverified origin` (and the neutral in-flight state, which asserts no trust at all), reachable on every platform in a way that platform actually affords."
# The sentence is ONE core rule, `trust_indicator_detail` (werust-core), beside
# the badge rule it explains. `docs/adr/0001` makes the trust posture a product
# surface and `docs/adr/0006` makes it a two-axis one, so a badge the user cannot
# interrogate is only half the capability: "content verified, mutable name" means
# nothing without the sentence saying the controller can repoint the name.
#
# THIS ROW IS NEW BECAUSE THE CAPABILITY WAS SILENTLY DESKTOP-ONLY. The
# `trust-indicator` row above was `implemented` on all four contexts and stayed
# honest about the BADGE, while the explanation existed only where a hover tooltip
# does: the two mobile edges had hand-written `trustIndicator()` twins and had
# simply never written a `trustIndicatorDetail()` to go with them, for months. It
# is split out rather than folded into `trust-indicator` precisely so that gap can
# never hide inside a row that is green for the badge (task
# `mobile-chrome-presentation-from-one-derivation`,
# docs/spikes/mobile-chrome-presentation-from-one-derivation/DECISIONS.md).
#
# Per platform, all four from that ONE rule:
# * desktop: the GTK trust badge carries the sentence BOTH ways
#   (crates/werust/src/main.rs). As its hover TOOLTIP
#   (`set_tooltip_text(trust_indicator_detail(state))`), and — since
#   `ipns-tofu-pin-and-warn-on-change` turned the badge from a plain `Label` into
#   a `MenuButton` opening a `Popover` to hold the bless action — as the first
#   line INSIDE that popover, in full, so the explanation is readable and not only
#   hover-discoverable. Before that task the tooltip was the only desktop surface
#   for it.
# * macos: the AppKit badge's tooltip, from the shared `desktop-paint` snapshot's
#   `trust_detail` (crates/werust-macos/src/window.rs); read back out of the real
#   NSTextField on a macos-14 runner (run 30572253620, the `trust-indicator` row's
#   measurement, which asserted the badge carried the core's ADR-0006 explanation
#   as its tooltip).
# * ios/android: a hover tooltip is not available and would not be discoverable if
#   it were, so each edge surfaces the SAME sentence TWICE over, from the
#   `trustIndicatorDetail` field the chrome JSON now carries: as the badge's
#   accessibility description (Android `contentDescription`, iOS
#   `accessibilityLabel`; a screen-reader user previously heard a glyph and three
#   words) and behind a TAP on the badge, which shows it in the platform's standard
#   alert titled with the badge (BrowserActivity.kt `showTrustExplanation`,
#   WKWebViewShellController.swift `showTrustExplanation`).
# HONEST LIMIT: the two mobile surfaces are wired in Kotlin/Swift, which this
# repo's pure-Rust gate never compiles. What the gate DOES enforce is that the
# sentence reaches both edges from the one derivation and that both really wire it
# to an accessibility description and a tap
# (crates/werust-core/tests/mobile_chrome_presentation_shape.rs); that a real
# device shows the alert is checked by the mobile CI legs building/launching the
# edges, not by an on-device assertion.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

[[capability]]
name = "mutable-name-change-warning"
description = "WARN, at the prominence a fail-closed failure gets, when a MUTABLE name the user personally TRUSTED now resolves to DIFFERENT content: a distinct, louder trust badge (never flattened into `mutable-name` or `name-via-trusted-rpc`, both of which only say the name COULD change) PLUS the high-contrast in-view banner naming the name, the day it was trusted and both CIDs. Never silently accepted, never a hard block \u2014 the user looks and decides."
# The WARNING half of trust-on-first-use (task `ipns-tofu-pin-and-warn-on-change`,
