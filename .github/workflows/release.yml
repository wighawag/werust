name: release

# The release pipeline — parity with wezig's `release.yml`, mobile included, on
# the deliberately Zig-less build path (GoReleaser `builder: rust`; ADR-0002,
# CONTEXT.md Conventions). The desktop leg is now NATIVE x86_64-only — no Zig at
# all (cargo-zigbuild's `zig cc` linker cannot link the binary's system
# WebKitGTK/GTK/glib; the native system linker can). Two paths:
#
#   * TAG PUSH (`v*`)      — a REAL release: GoReleaser publishes a GitHub Release
#                            with the desktop Linux x86_64 binary + checksums +
#                            a conventional-commit changelog, and the Android APK
#                            + iOS Simulator `.app` zip are attached to it with
#                            `gh release upload` — INDEPENDENTLY of the desktop leg
#                            (each mobile job idempotently ensures the Release
#                            exists first, so a desktop failure never blocks them).
#   * workflow_dispatch    — a DRY RUN: GoReleaser runs `--snapshot` (publishes
#                            NOTHING) and every leg uploads workflow artifacts via
#                            actions/upload-artifact instead of attaching to a
#                            Release, so all artifacts are validated end-to-end
#                            without cutting a release.
#
# Five build jobs mirror wezig's shape, all gated ONLY by `verify` (the
# pure-Rust gate) so a tag can never ship a red tree, and so every platform leg
# is DECOUPLED from the others (one platform's build failure cannot withhold
# another platform's artifact):
#   verify -> goreleaser (Linux desktop, native x86_64)
#   verify -> android-apk (Linux, SDK+NDK)
#   verify -> ios-simulator-app (macos-14)
#   verify -> macos-desktop-app (macos-14, universal unsigned `Werust.app`)
#   verify -> windows-desktop-app (windows-latest, unsigned `werust-windows.exe` zip)
#
# THE macOS DESKTOP ARTIFACT IS UNSIGNED, DELIBERATELY. `macos-desktop-app`
# attaches a universal (`x86_64` + `arm64`) `Werust.app` with NO code signature
# and NO notarization: both need an Apple Developer account and are a separate
# follow-on, the macOS analogue of the Android release-signing path above. When
# that follow-on comes it must copy the Android pattern (a secrets-PRESENCE env
# flag, a graceful no-op without it, honest artifact naming) rather than invent a
# second one. The zip is named `-unsigned` for that reason, and the README says
# how to open it. Decisions:
# docs/spikes/macos-release-packaging-leg/README.md.
#
# THE WINDOWS DESKTOP ARTIFACT IS UNSIGNED AND UNINSTALLERED, DELIBERATELY, AND
# IT NEEDS THE WebView2 RUNTIME. `windows-desktop-app` attaches a zip holding one
# self-contained `werust-windows.exe` with NO code signature and NO installer:
# both need a code-signing certificate and are a separate follow-on, the Windows
# analogue of the Android release-signing path above (and of the macOS
# notarization gap). When that follow-on comes it must copy the Android pattern
# (a secrets-PRESENCE env flag, a graceful no-op without it, honest artifact
# naming) rather than invent a third one. The zip is named `-unsigned` for that
# reason; SmartScreen WILL interrupt the first run, and the README says so and
# gives the click-path. The Edge WebView2 Runtime is a RUNTIME dependency that
# werust cannot promise is present (`docs/adr/0011` finding 6), so the README
# names that too. Decisions:
# docs/spikes/windows-release-packaging-leg/README.md.
#
# THE RELEASED VERSION REACHES THE COMPILED CODE. Every leg that compiles Rust
# exports `WERUST_VERSION` from the tag ref name; `crates/werust-core/build.rs`
# resolves it (stripping the leading `v`) into the ONE version accessor the
# desktop startup banner and the ⋮ browser menu on all three platforms read.
# GoReleaser derives only the ARCHIVE NAME from the tag, never the compiled
# binary, so without this injection a tagged `v0.2.6` release would ship every
# menu reading `werust 0.0.0`. On the dispatch dry-run the variable is simply
# empty (there is no tag), and the build script falls through to `git describe`.
# Pinned by `crates/werust-core/tests/release_plumbing_shape.rs`.
#
# THE SAME INJECTION IS WHAT VERSIONS THE ANDROID APK MANIFEST. The app module's
# Gradle script resolves that same `WERUST_VERSION` (else `git describe`, else the
# workspace Cargo version) for the APK's version fields, folding the semver triple
# into the monotonic integer Android sequences updates on. Nothing here computes a
# version of its own: a second source is what would let the APK manifest and the
# ⋮ menu disagree. Decisions: docs/spikes/android-apk-signing/README.md.
#
# THE ANDROID RELEASE KEY IS AN OPTIONAL SECRET, NEVER A COMMITTED KEYSTORE. The
# `android-apk` leg attaches a release-SIGNED `app-release.apk` alongside the
# debug APK when the four `ANDROID_KEYSTORE_*` / `ANDROID_KEY_*` repository
# secrets are configured, and is a graceful NO-OP when they are not (forks,
# dry-runs, or before the human creates them) — in which case the debug APK is
# attached under the honest name `app-debug-unsigned.apk`. The keystore is
# decoded from the secret into the runner's temp dir and handed to AGP's
# `signingConfigs.release` through the environment; nothing about the signing
# identity is committed. Setup + decisions:
# docs/spikes/android-apk-signing/README.md.
#
# THE RPC ENDPOINT IS AN OPTIONAL SECRET, NEVER A COMMITTED URL. Every leg that
# compiles Rust ALSO exports `WERUST_RPC_URL` from the OPTIONAL repository
# secret of the same name, so a release can point ENS resolution at a private
# endpoint (e.g. a self-hosted node) without its URL ever entering the repo.
# `WERUST_RPC_URL` is read ONCE at session construction by
# `crates/werust-core/src/ethereum.rs` (`rpc_endpoint`); when the secret is
# absent the expression substitutes the EMPTY string and the compiled code
# falls back to the public `DEFAULT_RPC_ENDPOINT` (`https://1rpc.io/eth`), so
# the workflow works identically with or without the secret configured.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The SAME verify gate as dorfl.json / verify.yml runs first: a tag build is
  # gated on a green tree (criterion 5).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned Rust toolchain
        # Same as verify.yml, and for the same reason: the workspace-root
        # `rust-toolchain.toml` pins the channel + the rustfmt/clippy components,
        # so nothing here selects a toolchain. It matters DOUBLY on this leg:
        # this is the `-D warnings` gate a TAG build is blocked on, so before the
        # pin a Rust release that added one lint could have failed a release of
        # code nobody had touched.
        run: |
          rustup show active-toolchain
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # Same as verify.yml: the gate builds the whole workspace (incl. the
      # webkit6/gtk4/glib-linking crates), so the system dev libs must be present
      # BEFORE the compile steps or `cargo build` fails with `glib-2.0 not found`.
      # libwebkitgtk-6.0-dev pulls in libgtk-4-dev + libglib2.0-dev +
      # libjavascriptcoregtk-6.0-dev (gtk4.pc / glib-2.0.pc / webkitgtk-6.0.pc).
      - name: Install WebKitGTK/GTK4 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwebkitgtk-6.0-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The verify gate, identical to dorfl.json's `verify`, step for step
      # (`crates/werust-core/tests/verify_gate_shape.rs` reds if the two drift).
      # Clippy lints ALL targets and denies warnings; see verify.yml's note.
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo build
        run: cargo build
      - name: cargo test
        run: cargo test

  # The desktop leg: GoReleaser's Rust builder cuts the native Linux x86_64 binary
  # + checksums + changelog. On a tag it PUBLISHES the Release; on a dispatch
  # dry-run it runs `--snapshot` (publishes nothing) and uploads the built dist
  # as a workflow artifact.
  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # The released version, compiled INTO the desktop binary. On a tag push this
      # is the tag ref name (`v0.2.6`); `crates/werust-core/build.rs` strips the
      # leading `v` and emits it as the one version accessor the startup banner
      # and the ⋮ menu read. On the dispatch dry-run there is no tag, so it is
      # empty and the build script falls through to `git describe`.
      WERUST_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # Optional private RPC endpoint for ENS resolution, exported to the build
      # env. Empty when the secret is not configured -> the public
      # `DEFAULT_RPC_ENDPOINT` is used (see the header comment).
      WERUST_RPC_URL: ${{ secrets.WERUST_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the full git history to build the conventional-commit
          # changelog; a shallow checkout would truncate it. It is ALSO what lets
          # `build.rs`'s `git describe` fallback resolve a real version on the
          # dry-run path (a shallow checkout has no tags).
          fetch-depth: 0

      - name: Install the desktop build toolchain (WebKitGTK system deps)
        # The desktop binary links webkit6/gtk4 (webview-renderer -> webkit6 0.5 /
        # gtk4 0.10), which need webkitgtk-6.0.pc / gtk4.pc / glib-2.0.pc — NOT the
        # old webkit2gtk-4.1 ABI. libwebkitgtk-6.0-dev owns webkitgtk-6.0.pc and
        # pulls in libgtk-4-dev + libglib2.0-dev + libjavascriptcoregtk-6.0-dev.
        # The native x86_64 build uses the host system linker, which searches
        # these system lib paths — no Zig / cargo-zigbuild involved. GoReleaser's
        # rust builder runs `rustup target add x86_64-unknown-linux-gnu` itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwebkitgtk-6.0-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-cargo-

      # TAG PATH: publish the real GitHub Release with binaries + checksums +
      # changelog. `github.ref` is `refs/tags/v...` on a tag push.
      - name: GoReleaser (tag — real release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # DRY-RUN PATH: snapshot build, publishes nothing.
      - name: GoReleaser (workflow_dispatch — snapshot dry-run, publishes nothing)
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=publish

      # On the dry-run, surface every desktop artifact as a workflow artifact so
      # the dispatch validates the desktop build without publishing.
      - name: Upload desktop artifacts (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: werust-desktop-dist
          path: dist/*

  # The Android leg: build the debug APK from the REAL app module (its Gradle
  # step cross-compiles the shared werust-core into libwerust_mobile.so per ABI),
  # run the acceptance ABI check, then attach the APK to the Release (tag) or
  # upload it as a workflow artifact (dry-run). Reuses the exact contract the
  # mobile-android task landed (task DECISIONS.md; forward-pointer on this task).
  # DECOUPLED from the desktop leg: `needs: verify` (NOT `needs: goreleaser`), so a
  # desktop build failure cannot block the APK. On a tag the Release may not exist
  # yet when this runs, so the attach step idempotently `gh release create`s it
  # first (a Release-EXISTENCE guarantee, not a desktop-build dependency).
  android-apk:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # The released version, cross-compiled INTO the Rust core the APK carries,
      # so the Android ⋮ menu reports the SAME version as desktop and iOS — AND
      # read by the app module's Gradle script for the APK manifest's version
      # fields, so the manifest cannot disagree with the menu. Same tag-or-empty
      # rule as the desktop leg above.
      WERUST_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # Optional private RPC endpoint (same secret pass-through as the desktop
      # leg; empty -> public default).
      WERUST_RPC_URL: ${{ secrets.WERUST_RPC_URL }}
      # RELEASE SIGNING, PRESENCE ONLY. '1' when the release keystore secret is
      # configured, empty otherwise. GitHub does NOT expose the `secrets` context
      # to a step's `if:` (only github/needs/strategy/matrix/job/runner/env/vars/
      # steps/inputs are available there), but a job-level `env:` CAN read it — so
      # the signing steps gate on `env.ANDROID_SIGNING_CONFIGURED`. Deliberately a
      # FLAG and not the material: the keystore + passwords stay in the single
      # step that needs them, out of the env every other step inherits.
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags + history, so `build.rs`'s `git describe` fallback resolves a real
          # version on the dry-run path (where WERUST_VERSION is empty).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install the Android Rust targets
        # A target is ADDITIVE: rustup installs it INTO the toolchain
        # `rust-toolchain.toml` pins (and installs that toolchain first if the
        # runner has not got it), so this does NOT re-select a compiler. Same for
        # the iOS/Windows target steps below.
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-cargo-

      - name: Build the debug APK (cross-compiles the Rust core per ABI)
        working-directory: crates/werust-android
        run: ./gradlew :app:assembleDebug

      - name: BUILD-leg check — the APK carries the Rust core for both ABIs
        # This is where criterion 4's ABI assertion actually EXECUTES (it is
        # deliberately NOT in the pure-Rust verify gate, which lacks the SDK/NDK).
        run: docs/spikes/mobile-android-shell-and-static-lib/check-apk-abis.sh crates/werust-android/app/build/outputs/apk/debug/app-debug.apk

      # ---- RELEASE SIGNING (optional; task `android-apk-signing`) ------------
      #
      # A debug-keystore APK installs, but carries no stable release identity, so
      # it cannot be updated in place or fed to any distribution channel. When the
      # four repository secrets exist, the leg ALSO builds a properly signed
      # `app-release.apk` and attaches it alongside the debug APK. When they do
      # not (a fork, or before the human creates them), every step below is
      # skipped — a graceful no-op, never a hard error — and the debug APK is
      # renamed to say so.
      #
      # The signing is done by AGP (`signingConfigs.release` in
      # crates/werust-android/app/build.gradle.kts) rather than by hand with
      # jarsigner: AGP's release pipeline zipaligns AND signs with apksigner (v1
      # JAR + v2 APK Signature Scheme), whereas jarsigner can only produce the v1
      # signature, which Android 11+ rejects on its own for a targetSdk-30+ app.
      # See docs/spikes/android-apk-signing/README.md (decision 1) and, in the
      # same file, the keytool command + the four secrets a human must create.
      - name: Decode the release keystore (only when the signing secrets exist)
        if: env.ANDROID_SIGNING_CONFIGURED == '1'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          keystore="${RUNNER_TEMP}/werust-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > "${keystore}"
          # Hand the path to the Gradle step below (a separate shell). The
          # keystore lives in the runner's temp dir, never in the workspace, so it
          # cannot be swept into an artifact.
          echo "ANDROID_KEYSTORE_PATH=${keystore}" >> "${GITHUB_ENV}"

      - name: Build the signed release APK
        if: env.ANDROID_SIGNING_CONFIGURED == '1'
        working-directory: crates/werust-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: BUILD-leg check — the release APK is signed and carries the Rust core
        if: env.ANDROID_SIGNING_CONFIGURED == '1'
        run: |
          apk=crates/werust-android/app/build/outputs/apk/release/app-release.apk
          # AGP names an UNSIGNED release build `app-release-unsigned.apk`, so the
          # mere existence of this name is the first evidence the signing config
          # applied.
          test -f "${apk}"
          # The artifact users actually install gets the SAME ABI guarantee as the
          # debug APK.
          docs/spikes/mobile-android-shell-and-static-lib/check-apk-abis.sh "${apk}"
          # Offline signature proof — apksigner ships in the SDK build-tools AGP
          # installed for compileSdk 34. Nothing here touches the network.
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "${apksigner}"
          "${apksigner}" verify --print-certs "${apk}"

      # NO-SECRETS PATH: the only artifact is the debug-keystore APK, so name it
      # for what it is. Nothing attached to a Release then claims a release
      # signature it does not carry.
      - name: Name the debug APK honestly when there is no release signature
        if: env.ANDROID_SIGNING_CONFIGURED != '1'
        run: |
          out=crates/werust-android/app/build/outputs/apk/debug
          mv "${out}/app-debug.apk" "${out}/app-debug-unsigned.apk"

      # TAG PATH: attach every APK this run produced to the Release. This leg no
      # longer `needs: goreleaser`, so the Release may not exist yet —
      # idempotently create it first (`|| true` swallows the "already exists"
      # error when the desktop leg or the other mobile leg got there first). This
      # is a Release-EXISTENCE guarantee, NOT a desktop-build dependency.
      #
      # Which APKs exist depends on the signing path above, so the upload takes
      # whichever of the three names is on disk (signed: app-release.apk +
      # app-debug.apk; unsigned: app-debug-unsigned.apk alone).
      - name: Attach the APKs to the Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          apks=()
          for apk in \
            crates/werust-android/app/build/outputs/apk/release/app-release.apk \
            crates/werust-android/app/build/outputs/apk/debug/app-debug.apk \
            crates/werust-android/app/build/outputs/apk/debug/app-debug-unsigned.apk; do
            [ -f "${apk}" ] && apks+=("${apk}")
          done
          gh release upload "${GITHUB_REF_NAME}" "${apks[@]}" --clobber

      # DRY-RUN PATH: upload whichever APKs exist as workflow artifacts, publish
      # nothing. Missing paths are simply skipped by upload-artifact.
      - name: Upload the APKs (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: werust-android-apk
          path: |
            crates/werust-android/app/build/outputs/apk/release/app-release.apk
            crates/werust-android/app/build/outputs/apk/debug/app-debug.apk
            crates/werust-android/app/build/outputs/apk/debug/app-debug-unsigned.apk

  # The iOS leg: build the Simulator `.app` on a macOS runner (Xcode/Simulator
  # are macOS-only), run the acceptance bundle check, zip the `.app`, then attach
  # it to the Release (tag) or upload it as a workflow artifact (dry-run). Reuses
  # the mobile-ios task's BUILD_ONLY packaging path + check-app-bundle.sh.
  # DECOUPLED from the desktop leg: `needs: verify` (NOT `needs: goreleaser`), so a
  # desktop build failure cannot block the `.app`. As with android-apk, the attach
  # step idempotently `gh release create`s the Release first on a tag.
  ios-simulator-app:
    needs: verify
    runs-on: macos-14
    env:
      # The released version, cross-compiled INTO the Rust core the `.app` carries,
      # so the iOS ⋮ menu reports the SAME version as desktop and Android. Same
      # tag-or-empty rule as the desktop leg above.
      WERUST_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # Optional private RPC endpoint (same secret pass-through as the desktop
      # leg; empty -> public default).
      WERUST_RPC_URL: ${{ secrets.WERUST_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags + history, so `build.rs`'s `git describe` fallback resolves a real
          # version on the dry-run path (where WERUST_VERSION is empty).
          fetch-depth: 0

      - name: Show Xcode + iOS runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install the iOS Simulator Rust target
        run: rustup target add aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ios-cargo-

      - name: Build the Simulator .app (BUILD_ONLY — no simulator boot)
        run: BUILD_ONLY=1 crates/werust-ios/build-and-run.sh

      - name: BUILD-leg check — the .app is a real bundle carrying the Rust core
        run: docs/spikes/mobile-ios-shell-and-static-lib/check-app-bundle.sh crates/werust-ios/build/WerustShell.app

      - name: Zip the Simulator .app
        run: |
          cd crates/werust-ios/build
          zip -r -y WerustShell-Simulator.app.zip WerustShell.app

      # TAG PATH: attach the zipped `.app` to the Release. This leg no longer
      # `needs: goreleaser`, so idempotently ensure the Release exists first
      # (`|| true` swallows the "already exists" error). A Release-EXISTENCE
      # guarantee, NOT a desktop-build dependency.
      - name: Attach the Simulator .app zip to the Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" crates/werust-ios/build/WerustShell-Simulator.app.zip --clobber

      # DRY-RUN PATH: upload the zipped `.app` as a workflow artifact, publish
      # nothing.
      - name: Upload the Simulator .app zip (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: werust-ios-simulator-app
          path: crates/werust-ios/build/WerustShell-Simulator.app.zip

  # The macOS DESKTOP leg (task `macos-release-packaging-leg`,
  # `docs/adr/0011-webview2-for-windows.md`'s macOS split, sub-task 4): build the
  # AppKit shell for BOTH darwin architectures, `lipo` the slices into ONE
  # universal binary, bundle it as `Werust.app` and attach the zip to the Release
  # (tag) or upload it as a workflow artifact (dry-run).
  #
  # A SIBLING of `ios-simulator-app`, not an extension of it: they share the
  # `macos-14` runner shape (Xcode, `lipo` and the darwin SDKs are macOS-only) but
  # nothing else, so an iOS failure can never withhold the desktop `.app` and vice
  # versa. Like every other leg it is DECOUPLED (`needs: verify` only), so on a
  # tag the Release may not exist yet when it runs, and the attach step
  # idempotently `gh release create`s it first (a Release-EXISTENCE guarantee, not
  # a dependency on another leg).
  #
  # UNSIGNED: see the header. Nothing here runs `codesign` or `notarytool`.
  macos-desktop-app:
    needs: verify
    runs-on: macos-14
    env:
      # The released version, compiled INTO both slices of the universal binary.
      # And because `bundle-app.sh` READS it back out of the compiled core
      # (`werust-core`'s `print_version` example), it is also the SAME string
      # that lands in the bundle's `CFBundleVersion`. So the Finder, the ⋮ menu and the other
      # platforms cannot disagree about the version. Same tag-or-empty rule as
      # every other leg.
      WERUST_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # Optional private RPC endpoint (same secret pass-through as the desktop
      # Linux leg; empty -> public default).
      WERUST_RPC_URL: ${{ secrets.WERUST_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags + history, so `build.rs`'s `git describe` fallback resolves a real
          # version on the dry-run path (where WERUST_VERSION is empty), which is
          # also the version stamped into `CFBundleVersion` there.
          fetch-depth: 0

      - name: Record what this run built on
        run: |
          sw_vers
          xcodebuild -version || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-macos-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-macos-desktop-cargo-

      # The SAME script a human runs on a Mac (the `crates/werust-ios/build-and-run.sh`
      # precedent): it adds both darwin targets, builds both release slices,
      # `lipo`s them and writes the minimal `Info.plist`.
      - name: Build both slices, lipo them, bundle Werust.app
        run: crates/werust-macos/bundle-app.sh

      - name: "BUILD-leg check: the .app is a real UNIVERSAL bundle at the released version"
        # Where criteria 2 + 3 actually EXECUTE: `lipo` proves both
        # architectures are in the one binary, and `CFBundleVersion` is compared
        # against the version the compiled Rust core reports (so a second version
        # source cannot creep in unnoticed). Deliberately NOT in the pure-Rust
        # verify gate, which has no `lipo` and no darwin SDK.
        run: docs/spikes/macos-release-packaging-leg/check-macos-app-bundle.sh crates/werust-macos/build/Werust.app

      - name: Zip the .app
        # `-y` keeps symlinks as symlinks, the same reason the iOS leg passes it.
        # The name says UNSIGNED: the Android leg's honest-naming precedent, so
        # nothing on the Release page implies a signature the artifact lacks.
        run: |
          cd crates/werust-macos/build
          zip -r -y Werust-macos-universal-unsigned.app.zip Werust.app

      # TAG PATH: attach the zipped `.app` to the Release, idempotently ensuring
      # the Release exists first (`|| true` swallows the "already exists" error
      # when another leg got there first).
      - name: Attach the macOS .app zip to the Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" crates/werust-macos/build/Werust-macos-universal-unsigned.app.zip --clobber

      # DRY-RUN PATH: upload the zipped `.app` as a workflow artifact, publish
      # nothing.
      - name: Upload the macOS .app zip (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: werust-macos-desktop-app
          path: crates/werust-macos/build/Werust-macos-universal-unsigned.app.zip

  # The WINDOWS DESKTOP leg (task `windows-release-packaging-leg`,
  # `docs/adr/0011-webview2-for-windows.md`'s Windows split, sub-task 5): build
  # the Win32 shell in release for `x86_64-pc-windows-msvc` and attach a zip of
  # the one self-contained `.exe` to the Release (tag) or upload it as a workflow
  # artifact (dry-run).
  #
  # ONE FILE IN THE ZIP, and that is a property of the target, not a shortcut:
  # `*-pc-windows-msvc` statically links `WebView2LoaderStatic.lib`, so nothing
  # has to travel beside the binary (`docs/adr/0011` finding 6 — the `-gnu`
  # target would need `WebView2Loader.dll` shipped alongside). What the exe still
  # needs at RUN time is the WebView2 Runtime itself; see the header.
  #
  # A SIBLING of the `windows-renderer.yml` leg, not an extension of it: that leg
  # COMPILES and EXERCISES the Windows crates (including the window smoke) on
  # every relevant push, and this one PACKAGES them on a tag. Like every other
  # release leg it is DECOUPLED (`needs: verify` only), so on a tag the Release
  # may not exist yet when it runs and the attach step idempotently
  # `gh release create`s it first (a Release-EXISTENCE guarantee, not a
  # dependency on another leg).
  #
  # UNSIGNED: see the header. Nothing here runs `signtool` or builds an installer.
  windows-desktop-app:
    needs: verify
    runs-on: windows-latest
    env:
      # The released version, compiled INTO the exe: `crates/werust-core/build.rs`
      # resolves it and the ⋮ menu inside the window reports it. Nothing else in
      # this leg stamps a version anywhere — the zip's name deliberately carries
      # none — so there is no second source to disagree with it. Same
      # tag-or-empty rule as every other leg.
      WERUST_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # Optional private RPC endpoint (same secret pass-through as every other
      # leg; empty -> public default).
      WERUST_RPC_URL: ${{ secrets.WERUST_RPC_URL }}
    steps:
      - name: Check the tree out byte-identically (no CRLF rewrite)
        # The same first step `windows-renderer.yml` takes, for the same reason:
        # Git for Windows defaults to `core.autocrlf=true`, and this repo's
        # source-shape tests PARSE committed text. Must run BEFORE the checkout.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # Tags + history, so `build.rs`'s `git describe` fallback resolves a real
          # version on the dry-run path (where WERUST_VERSION is empty) — which is
          # the version the artifact check then expects to find inside the exe.
          fetch-depth: 0

      - name: Record what this run built on
        # The ONE shared registry read, the same step both other Windows legs
        # use. The WebView2 Runtime is EVERGREEN and is this artifact's RUNTIME
        # dependency, so the release log records the version the build machine
        # had rather than leaving it unstated.
        uses: ./.github/actions/webview2-runtime-version

      - name: Install the Windows Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-windows-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-windows-desktop-cargo-

      - name: Build werust-windows (release, x86_64-pc-windows-msvc)
        # Package-SCOPED, never a bare workspace build: `werust` and
        # `webview-renderer` bind gtk4/webkit6 through pkg-config and are measured
        # RED on a Windows runner (docs/spikes/windows-renderer-ci-leg/README.md).
        # The crate's build script embeds the application manifest into this exe
        # (comctl32 v6 + per-monitor-v2 DPI awareness) by handing it to the MSVC
        # linker; the check below proves it really landed.
        run: cargo build -p werust-windows --release --target x86_64-pc-windows-msvc

      - name: "BUILD-leg check: a real exe, with the manifest embedded, at the released version"
        # Where criteria 1-3 actually EXECUTE. Deliberately NOT in the pure-Rust
        # verify gate, which has no `.exe` to look inside: the gate pins the
        # workflow's SHAPE (crates/werust-core/tests/release_plumbing_shape.rs)
        # and this pins the ARTIFACT. `bash` rather than pwsh so it reads as the
        # twin of the Android/iOS/macOS BUILD-leg checks it is modelled on, and so
        # it can be exercised from Linux.
        shell: bash
        # Invoked as an ARGUMENT to bash rather than by path: on a Windows
        # checkout the POSIX executable bit is not a real file attribute, so
        # `./script.sh` would rely on Git Bash's shebang heuristic. The other
        # three BUILD-leg checks run on unix runners and can be executed directly.
        run: bash docs/spikes/windows-release-packaging-leg/check-windows-artifact.sh

      - name: Zip the exe (unsigned)
        # PowerShell, because `zip` is not on a Windows runner's PATH and
        # `Compress-Archive` is the platform's own. The name says UNSIGNED: the
        # Android/macOS honest-naming precedent, so nothing on the Release page
        # implies a signature the artifact does not carry.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/werust-windows/build | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/werust-windows.exe crates/werust-windows/build/
          Compress-Archive -Force `
            -Path crates/werust-windows/build/werust-windows.exe `
            -DestinationPath crates/werust-windows/build/werust-windows-x86_64-unsigned.zip

      - name: "BUILD-leg check: the zip really carries the exe"
        shell: bash
        run: bash docs/spikes/windows-release-packaging-leg/check-windows-artifact.sh --zip crates/werust-windows/build/werust-windows-x86_64-unsigned.zip

      # TAG PATH: attach the zip to the Release, idempotently ensuring the
      # Release exists first (`|| true` swallows the "already exists" error when
      # another leg got there first).
      - name: Attach the Windows zip to the Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" crates/werust-windows/build/werust-windows-x86_64-unsigned.zip --clobber

      # DRY-RUN PATH: upload the zip as a workflow artifact, publish nothing.
      - name: Upload the Windows zip (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: werust-windows-desktop-app
          path: crates/werust-windows/build/werust-windows-x86_64-unsigned.zip
