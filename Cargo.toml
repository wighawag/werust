[workspace]
resolver = "2"
members = [
    "crates/werust",
    "crates/werust-core",
    "crates/renderer",
    "crates/webview-renderer",
    # The toolkit-free half every system-webview backend shares (load lifecycle,
    # navigate URL rule, the ADR-0008 off-thread `ipfs://` boundary). MOVED out
    # of `webview-renderer` so the macOS backend can reuse it (never copy it).
    "crates/webview-shared",
    # The macOS WKWebView `Renderer` backend (ADR-0011's macOS split, sub-task 2).
    # A workspace member so the Ubuntu `verify` gate compiles and tests its
    # host-independent half (the decision rules + the source-shape guard); its
    # WKWebView half is `#[cfg(target_os = "macos")]` and is built and exercised
    # by `.github/workflows/macos-renderer.yml` on the existing `macos-14` runner.
    "crates/macos-renderer",
    # The macOS WINDOW: the AppKit chrome over that backend (ADR-0011's macOS
    # split, sub-task 3). A workspace member for the same reason its engine is:
    # the Ubuntu `verify` gate compiles and tests its host-independent half
    # (`paint.rs` — every display value, derived from the shared core — plus the
    # capture wiring over the seam) and runs the source-shape guard over the
    # AppKit source it cannot compile; the window itself is
    # `#[cfg(target_os = "macos")]` and is built, tested and RUN off-screen by
    # `.github/workflows/macos-renderer.yml` on the `macos-14` runner.
    "crates/werust-macos",
    # The toolkit-free half every NATIVE-WIDGET desktop painter shares: the
    # values a window paints (derived from `werust-core`), the palette that
    # gives the core's exported class names a colour, the `BrowserMenu` items
    # and the debug-view rows. Extracted out of `werust-macos::paint` by task
    # `windows-win32-window-and-chrome` so the Win32 window consumes the one
    # carrier instead of minting a second copy of it (and a third transcription
    # of the palette). Toolkit-free, so the Ubuntu `verify` gate compiles and
    # unit-tests it against the REAL core — which is what makes "the native
    # windows paint the shared derivation" a checked fact on every run.
    "crates/desktop-paint",
    # The Windows WINDOW: the Win32 chrome over the WebView2 backend (ADR-0011's
    # Windows split, sub-task 3). A workspace member for the same reason its
    # engine is: the Ubuntu `verify` gate compiles and tests its host-independent
    # half (the durable-profile rule and the capture wiring over the seam) and
    # runs the source-shape guard over the Win32 source it cannot compile; the
    # window itself is `#[cfg(windows)]` and is built, tested and RUN off-screen
    # by `.github/workflows/windows-renderer.yml` on a `windows-latest` runner.
    "crates/werust-windows",
    # The macOS ORIGIN PROBE: the WebKit analogue of `windows-origin-probe`, which
    # turns this repo's recorded iOS `WKURLSchemeHandler` MECHANISM ANALYSIS into a
    # runtime MEASUREMENT (both WebKit ports share the mechanism). A workspace
    # member so the Ubuntu gate compiles and tests its host-independent half; its
    # WKWebView half is `#[cfg(target_os = "macos")]`.
    "crates/macos-origin-probe",
    "crates/native-renderer",
    "crates/fetcher",
    "crates/script-engine",
    "crates/werust-android/rust",
    "crates/werust-ios/rust",
    # The Windows WebView2 `Renderer` backend (ADR-0011's Windows split,
    # sub-task 2, funded by Amendment 1 and unblocked by Amendment 2's measured
    # `registered-ipfs-scheme` verdict). A workspace member for the same reason
    # `macos-renderer` is: the Ubuntu `verify` gate compiles and tests its
    # host-independent half (`pure.rs` — the decisions the COM wiring makes — plus
    # the source-shape guard); its WebView2 half is `#[cfg(windows)]` and is
    # built, tested and RUN by `.github/workflows/windows-renderer.yml` on a
    # `windows-latest` runner.
    "crates/windows-renderer",
    # Gate 0 of the Windows work (ADR-0011): a WebView2 origin PROBE, not shell
    # code. A workspace member so the Ubuntu `verify` gate compiles and tests
    # its host-independent half (the decision rule, the canned site, the CLI);
    # its WebView2 half is `#[cfg(windows)]` and runs in
    # `.github/workflows/windows-origin-probe.yml`.
    "crates/windows-origin-probe",
]

[workspace.package]
# The current released version. It is the LAST-RESORT version source (see
# `crates/werust-core/build.rs`): a release build is injected with `WERUST_VERSION`
# from the tag and a dev checkout resolves `git describe`, but an unpacked source
# tarball with no git falls back to THIS, so it must not lie. Bump it with the
# release it names.
version = "0.2.9"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wighawag/werust"
