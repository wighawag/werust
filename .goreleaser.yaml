# GoReleaser config for werust — the deliberately Zig-less release path, now
# Zig-less in the FULL sense (no Zig linker either).
#
# This is the port of wezig's `.goreleaser.yaml`, swapping GoReleaser's
# `builder: zig` for its native `builder: rust`. The desktop binary dynamically
# links system WebKitGTK/GTK/glib; cargo-zigbuild's `zig cc` linker does NOT
# search the host's system library paths, so it cannot link glib-2.0 /
# gobject-2.0 / cairo even with `libwebkitgtk-6.0-dev` installed. So the desktop
# leg is now NATIVE x86_64-only: GoReleaser's rust builder with `command: build`
# (plain `cargo build`) drives the host system linker, which links WebKitGTK
# fine (the `verify` job + local builds prove it). arm64 lives where it belongs
# now — mobile (NDK/Xcode) — and desktop arm64 Linux is dropped (`docs/adr/0002`).
#
# A tag push (`v*`) cuts one GitHub Release carrying the desktop Linux x86_64
# binary + checksums + a conventional-commit changelog; the mobile artifacts
# (Android APK, iOS Simulator `.app` zip) are attached INDEPENDENTLY by the
# hand-written jobs in `.github/workflows/release.yml` (they no longer wait on
# this desktop leg — CONTEXT.md Conventions, `docs/adr/0002`).
#
# The release workflow ALSO runs this in `--snapshot` mode on a
# `workflow_dispatch` dry-run, which builds every artifact but publishes nothing.
version: 2

builds:
  - id: werust-desktop
    # The Zig-less build path: GoReleaser's native Rust builder driving a plain
    # native `cargo build` (NO cargo-zigbuild, NO `zig cc` linker).
    builder: rust
    binary: werust
    # `cargo build` (native) the desktop binary crate for the host x86_64 target.
    # `command: build` picks plain `cargo build` over the rust builder's default
    # `zigbuild`; `tool` stays the default `cargo`. The native system linker
    # searches the host's system lib paths, so it links WebKitGTK/GTK/glib — the
    # exact thing `zig cc` could not do.
    command: build
    # werust is a multi-crate Cargo workspace, so cargo cannot disambiguate which
    # crate to build: GoReleaser's rust builder errors "you need to specify which
    # workspace to build, please add '--package=[name]'". Select the `werust`
    # binary crate. GoReleaser passes `flags` straight to `cargo build` and
    # accepts `--package=`/`-p=` as the workspace selector (its `isSettingPackage`
    # check). Setting an explicit `flags` list REPLACES GoReleaser's `--release`
    # default, and its rust builder then copies the artifact from
    # `target/<triple>/release/`, so `--release` must stay or there is nothing to
    # package.
    flags:
      - --release
      - --package=werust
    # Desktop Linux x86_64 ONLY, built natively (no cross-compile). arm64 is
    # mobile-only now; desktop arm64 Linux is dropped (`docs/adr/0002`). Rust
    # target triple, as the Rust builder expects. GoReleaser runs
    # `rustup target add` for each declared target itself, so no before-hook is
    # needed to install it.
    targets:
      - x86_64-unknown-linux-gnu

# One archive (x86_64 desktop) so the Release carries a downloadable tarball.
archives:
  - id: werust-desktop
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

# Checksums for every artifact (criterion 1: "+ checksums on a tag").
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# The changelog is generated FROM conventional-commit git history — there are NO
# per-change changeset files (CONTEXT.md Conventions; the load-bearing
# conventional-commit rule). Grouped by conventional-commit type.
#
# THE EXCLUDE FILTERS ARE SCOPE-AWARE, and that is load-bearing rather than
# tidy. GoReleaser matches BOTH the group regexps and the exclude filters
# against the raw commit SUBJECT (its `internal/pipe/changelog`: excludes run
# first, then each group consumes what it matches, in CONFIG order). The groups
# here always knew about scopes (`feat(\(.+\))??!?:`), but the excludes used to
# be bare `^chore:` / `^ci:` / `^test:` / `^docs:`, and this repo scopes nearly
# every housekeeping commit, so they matched almost nothing: measured over the
# 77 commits in `v0.3.2..main`, `^chore:` matched 0 of 7, `^ci:` 0, `^test:` 0
# and `^docs:` 1 of 22. `v0.3.2` therefore published an `### Others` section
# full of `ci(android-apk):` and `task:` lines: the exact commits the filters
# existed to delete. Each pattern below now MIRRORS the groups' own
# `(\(.+\))??!?:` shape, so the scoped and unscoped forms drop out identically,
# rather than inventing a second convention.
#
# Measurement + decisions:
# docs/spikes/release-notes-lose-the-conventional-commit-changelog-to-a-race/.
# Pinned semantically (the patterns are COMPILED and applied to real subjects,
# not eyeballed) by `crates/werust-core/tests/release_plumbing_shape.rs`.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      # Housekeeping conventional types, scoped or not, breaking or not.
      - '^chore(\(.+\))??!?:'
      - '^ci(\(.+\))??!?:'
      - '^test(\(.+\))??!?:'
      - '^docs(\(.+\))??!?:'
      # work/-contract bookkeeping: an ITEM moved between status folders, which
      # says nothing about what the software does. These subjects are not
      # conventional-commit types at all (`task:`, `notes(gate-3):`,
      # `findings+task:`, `review(spec):` …), so no group regexp would ever
      # claim them and every one of them landed in `Others`.
      - '^(tasking|task|notes|obs|findings|spec|review)(\+[a-z]+)?(\(.+\))??!?:'
      # dorfl runner lifecycle commits pushed straight to `main`. There are ~30
      # `surface task:<slug> (stuck): …` commits in `v0.3.2..main` alone (see
      # work/notes/observations/dorfl-bounce-surface-duplicates-the-stuck-question-and-spams-main-2026-08-04.md);
      # they are the runner talking to itself, and each carries a multi-KB
      # review verdict as its SUBJECT.
      - '^surface task:'
      - '^dorfl '
      - "Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# On a `workflow_dispatch` snapshot dry-run this whole `release` section is
# skipped (GoReleaser `--snapshot` never touches the forge); on a tag it
# publishes the GitHub Release.
release:
  github:
    owner: wighawag
    name: werust
  # The mobile jobs (android-apk, ios-simulator-app) attach their artifacts to
  # THIS release afterwards via `gh release upload <tag>`, so don't mark it a
  # draft that they cannot upload into, and don't auto-finalize before they run.
  draft: false
  prerelease: auto
  # THE BODY OF THIS REPO'S RELEASES IS GORELEASER'S TO WRITE, even when it did
  # not create the Release. All four artifact legs are decoupled from this one
  # (`needs: verify`), so each guarantees the Release exists before uploading
  # into it, and on a tag one of THEM usually wins that race. GoReleaser's
  # default `mode: keep-existing` returns the EXISTING body whenever it is
  # non-empty (`internal/client/release_notes.go`), so the changelog prepared
  # here was simply discarded: `v0.3.1` published a lone compare link and
  # `v0.3.0`, the release that added macOS and Windows, published one PR
  # title. The legs now create with an EMPTY body (`--notes ""`, no
  # `--generate-notes`), which alone would be enough; `replace` states the
  # ownership outright so the changelog cannot go missing again the moment some
  # future leg, retry or hand-edit puts ANY text there first.
  #
  # The cost, named: a human edit to a published body is overwritten if that
  # tag's workflow is ever re-run. That is the right trade for a derived
  # changelog (CONTEXT.md Conventions), but it is why the `v0.3.0` backfill is
  # done by hand on an old tag rather than by re-firing its workflow; see
  # docs/spikes/release-notes-lose-the-conventional-commit-changelog-to-a-race/.
  mode: replace
  # A RE-RUN OF A TAG BUILD MUST NOT FAIL ON ITS OWN FIRST ATTEMPT'S ASSETS.
  # `v0.2.9` is still red for exactly that: both runs ended in
  # `422 Validation Failed [{Resource:ReleaseAsset Field:name Code:already_exists}]`
  # on `checksums.txt` and the tarball the FIRST attempt had already uploaded
  # (evidence + runs:
  # docs/spikes/release-notes-lose-the-conventional-commit-changelog-to-a-race/README.md,
  # "The sibling defect").
  # Every other leg was made idempotent on purpose (`gh release upload
  # --clobber`); this is the same guarantee in GoReleaser's own vocabulary: on
  # a 422 it deletes the colliding asset and retries the upload. GitHub-only,
  # which is the only forge this repo publishes to.
  replace_existing_artifacts: true

# A snapshot build (the dispatch dry-run) needs a deterministic version name
# since there is no tag.
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
