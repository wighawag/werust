[[capability]]
name = "blank-window-open-navigates-in-place"
description = "A `target=\"_blank\"` link / `window.open(url)` (a new-window request) navigates IN THE CURRENT view instead of being silently dropped (werust has no tab/window model yet), routed through the NORMAL navigation/scheme path so an `ipfs://`/ENS target is still hash-verified and an unsupported one refused (no trust bypass), and no real second window/tab is spawned."
# werust has no tab/window model yet, so each platform's NATIVE new-window hook
# routes the request into the SAME view via the SAME shared in-place rule
# (`renderer::new_window_action`, pinned display-free by the seam tests
# `a_new_window_request_navigates_the_current_view_in_place` in crates/renderer
# and `a_new_window_request_navigates_the_existing_view_in_place_no_second_view`
# in crates/webview-renderer). The in-place load goes through each platform's
# NORMAL load path, so an `ipfs://`/ENS `_blank` target still hits the
# hash-verified scheme handler and an unsupported one is still refused — the hook
# is a router, not a trust bypass. Desktop: `WebViewRenderer::install_new_window_in_place`
# wires WebKitGTK's `create` signal (crates/webview-renderer/src/backend.rs),
# reads the navigation action's target URI, loads it into the existing
# `self.view` via `load_uri`, and returns NULL so no second WebView is created.
# It wires `create` through the RAW glib signal (`connect_local("create", …)`,
# answering `None::<gtk4::Widget>`) because the typed `connect_create` binding's
# generated return type is a NON-nullable `gtk::Widget` and cannot express the
# "no new view" answer the signal contract requires; returning the EXISTING view
# instead (the shipped v0.2.5 shape) made WebKitGTK deref an empty
# `std::optional<WebCore::WindowFeatures>` and ABORT on every `_blank` click
# (task `fix-desktop-create-signal-crash-on-blank-links`, before/after repro +
# why `decide-policy` alone is not enough — it never fires for `window.open` —
# at docs/spikes/fix-desktop-create-signal-crash-on-blank-links/README.md; the
# live guard is the ignored `real_webview_new_window_requests_load_in_place_without_aborting`).
# iOS: `WKWebViewShellController` conforms to `WKUIDelegate` and
# implements `webView(_:createWebViewWith:for:windowFeatures:)` — on a nil target
# frame it calls `webView.load(navigationAction.request)` on the main view and
# returns nil (no new WKWebView). Android: `BrowserActivity` sets
# `settings.setSupportMultipleWindows(true)` and a `WebChromeClient.onCreateWindow`
# (CoreWebChromeClient) recovers the target URL via a throwaway transport WebView
# and loads it into the SAME WebView, creating no real second window. The
# runtime-only mobile hooks (Swift/Kotlin) carry recorded manual verification
# steps at docs/spikes/blank-and-window-open-links-navigate-in-place/README.md;
# the shared in-place decision is recorded at docs/adr/0010. Task
# `blank-and-window-open-links-navigate-in-place`, field finding C.
# macOS: `MacosRenderer`'s `NavigationBridge` conforms to `WKUIDelegate` and
# implements `webView:createWebViewWithConfiguration:forNavigationAction:windowFeatures:`,
# routing the target through the SAME shared `renderer::new_window_action`, loading
# it into the existing view via the normal load path (so an `ipfs://` `_blank`
# target still hits the hash-verified handler) and returning nil, so WebKit creates
# no second `WKWebView`. The AppKit window neither opens a window nor re-decides
# the rule (asserted by `crates/werust-macos/tests/macos_window_shape.rs`). HONEST
# LIMIT: compiled and shape-guarded, but no CI step CLICKS a `_blank` link on
# macOS — that is manual step 9 of
# docs/spikes/macos-appkit-window-and-chrome/README.md.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

