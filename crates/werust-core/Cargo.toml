[package]
name = "werust-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renderer = { path = "../renderer" }
fetcher = { path = "../fetcher" }
# The CID + multibase crate, for canonicalising an `ipns-ns` libp2p-key name to
# its base36 `k…` form (the string a trustless gateway accepts at
# `GET /ipns/{name}`) and deriving the `PeerId` a record verifies against. The
# SAME `cid 0.11` the `fetcher` seam verifies against (re-exported as
# `fetcher::Cid`); pinned here too so the `Base`/`multihash` helpers are in
# scope without leaking a second lineage.
cid = "0.11.3"
serde_json = "1"
# keccak256 for the ENS `namehash` (ENSIP-1) and the function selectors ENS
# resolution ABI-encodes. `sha3::Keccak256` is the LEGACY Keccak variant
# Ethereum uses (NOT NIST SHA3-256), from the same vetted RustCrypto family as
# `fetcher`'s `sha2`/`digest` (`digest 0.10`) — a BOUND primitive, never a
# hand-rolled hash (`CONTEXT.md` / `docs/adr/0001`: bind vetted crypto).
sha3 = "0.10"
# ENSIP-1/ENSIP-15 name normalization for `namehash`. A Rust port of adraffy's
# reference ENS normalizer, returning a `Result` so an unnormalizable name is a
# distinct fail-closed error rather than a silently-mangled label — bound, not
# hand-rolled Unicode normalization. See the `ens` module's normalization
# decision in `docs/spikes/ens-namehash-registry-resolver-contenthash-resolution/`.
ens-normalize = "0.1.1"
# The bound HTTP+TLS stack the `RpcProvider` backend's own minimal synchronous
# JSON-RPC POST transport binds (the `ethereum` module's `UreqRpcTransport`).
# A JSON-RPC `eth_call` is a POST with a JSON body, which the GET-only `Fetcher`
# seam cannot express, so this backend binds `ureq`'s POST behind its own
# `RpcTransport` seam (bound, not hand-rolled) rather than widening the shared
# `Fetcher` seam. Same vetted rustls-backed client the `fetcher` crate binds;
# TLS is NEVER hand-written. Pinned to match the repo's exact-version style.
ureq = "=3.3.0"
# IPNS record decode + client-side signature/validity verification, so werust
# resolves a MUTABLE `ipns-ns` name to its current CID without an IPFS node and
# without HAND-ROLLING signature crypto (`docs/adr/0001`, `docs/adr/0007`). It
# sits on the SAME `ipld-core` / `cid 0.11` / `multihash` / `quick-protobuf`
# lineage the `fetcher` CAR path already binds, and its signature crypto is the
# vetted `libp2p-identity` (ed25519/secp256k1/ecdsa/rsa) — never in-house. NO
# async runtime (mirrors the sync `Fetcher` seam and `docs/adr/0004`).
rust-ipns = "0.9.0"
# The `PeerId` an IPNS name (a libp2p-key CID) hashes to, which
# `rust-ipns`'s `Record::verify` checks the record's signature + name binding
# against. Same crate + version `rust-ipns` binds, so the `PeerId` type matches
# with no skew. Default features off (no `rand`: werust only VERIFIES records,
# never generates keys in production) plus `peerid`.
libp2p-identity = { version = "0.2.14", default-features = false, features = ["peerid"] }
# Wire-normalize a V2-only IPNS record (one that OMITS the deprecated top-level
# protobuf fields, the shape modern gateways serve) into the V1+V2 shape
# `rust-ipns 0.9.0`'s `Record::verify` requires, WITHOUT touching any crypto:
# `quick-protobuf` re-shapes the `IpnsEntry` protobuf and `serde_ipld_dagcbor`
# reads the signed dag-cbor `Data` the mirror fields are copied from. Both sit on
# the SAME `quick-protobuf` / `ipld-core 0.4` lineage the `fetcher` CAR path and
# `rust-ipns` itself already bind (no new lineage). See
# `docs/spikes/prominent-load-failure-and-ipns-resolution-diagnosis/` and the
# `ronan-eth-ipns-v2-only-record-verify-bug` finding for why this shim exists.
quick-protobuf = "0.8"
serde_ipld_dagcbor = "0.6"
# Derive the reader for the five reserved dag-cbor `Data` fields the V2-only
# normalization copies into the protobuf mirror. `serde` + `serde_bytes` (for the
# CBOR byte-string `Value`/`Validity`) are the same lineage `fetcher` binds.
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
# Parses the release-plumbing config files (`.goreleaser.yaml` +
# `.github/workflows/release.yml`) for the shape test in
# `tests/release_plumbing_shape.rs`. Dev-only: it never enters the shipped
# binary, only `cargo test` (the verify gate).
serde_yaml = "0.9"
# Parses the checked-in platform-capability parity matrix
# (`docs/platform-capability-matrix.toml`) for the parity guard in
# `tests/platform_capability_parity.rs`. Dev-only, like `serde_yaml` above: it
# never enters the shipped binary, only `cargo test` (the verify gate).
toml = "1"
# Test-only: SIGN pinned IPNS record fixtures (a real ed25519 keypair + a real
# V2 signature) so the IPNS module's tests verify against a genuine record
# offline, NO live network. `rand`/`ed25519` let a test mint a keypair and sign;
# production `libp2p-identity` above stays verify-only. Same crate/version as
# `rust-ipns`, so the `Keypair`/`PeerId` types match.
libp2p-identity = { version = "0.2.14", features = ["peerid", "ed25519", "rand"] }
# Build the EOL validity timestamp for the signed record fixtures. Same `chrono`
# lineage `rust-ipns` binds.
chrono = "0.4"
