# 200/404/410/451 + placeholders/splat) is recorded in
# docs/spikes/ipfs-web-redirects-and-404-fallback-support/DECISIONS.md. The 3xx
# half is its OWN capability row below (`ipfs-redirects-3xx-navigation`) because it
# is a NAVIGATION, not a served response.
desktop = { state = "implemented" }
macos = { state = "implemented" }
ios = { state = "implemented" }
android = { state = "implemented" }

