<h1>The v0 Subset</h1>
<p class="lead">A tiny, <strong>fixed</strong> subset of HTML and CSS, rendered by the <em>native</em> T0 path.</p>
<h2>What it covers</h2>
<p>Block and inline flow over a handful of elements: headings, paragraphs, lists, and inline emphasis such as <b>bold</b>, <i>italic</i>, and <a href="https://example.com/">links</a>.</p>
<p class="note">Everything outside the allowlist is dropped, not rendered.</p>
