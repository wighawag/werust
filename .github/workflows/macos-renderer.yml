name: macos-renderer

# The macOS leg (tasks `macos-wkwebview-renderer-backend` and
# `macos-appkit-window-and-chrome`, `docs/adr/0011-webview2-for-windows.md`'s
# macOS split, sub-tasks 2 and 3). It does four things a Linux gate can never do:
#
#   1. BUILDS the `#[cfg(target_os = "macos")]` WKWebView backend AND the AppKit
#      window against a real SDK, so the Objective-C wiring is compiled rather
#      than merely parsed.
#   2. EXERCISES both TRUST HOOKS on a real WKWebView -- an `ipfs://<cid>` load
#      whose bytes hash-verify, and a page that sees the native EIP-1193
#      `window.ethereum` and round-trips a request over the script bridge --
#      offline, with a negative control that must fail.
#   3. CONSTRUCTS AND DRIVES THE REAL WINDOW (`werust-macos`'s `window_smoke`):
#      a real `NSWindow`, toolbar, trust indicator, error banner, ⋮ menu and
#      debug view, loaded off-screen with a pinned content-addressed fixture,
#      asserting what the real WIDGETS hold. That is the only place the AppKit
#      layer is executed at all; everything derivable about it is already
#      unit-tested on the Ubuntu gate (`crates/desktop-paint`, the shared painter
#      half both native desktop windows consume).
#   4. MEASURES the `WKURLSchemeHandler` origin behaviour
#      (`crates/macos-origin-probe`), which is what turns this repo's recorded
#      iOS MECHANISM ANALYSIS into a runtime fact: both WebKit ports share the
#      mechanism, so a macOS measurement settles it for iOS too.
#
# It needs no Mac hardware: `macos-14` is the runner the iOS leg already uses.
#
# A SEPARATE leg from the pure-Rust `verify` gate, exactly like `mobile-ios.yml`
# and `windows-origin-probe.yml`: the Ubuntu gate compiles and tests the
# host-independent halves (the pure decision rules, the source-shape guard, the
# probe's verdict rule) but can never build WebKit.
#
# WHY THE PROBE MUST STAY RE-RUNNABLE: WebKit ships with the OS and cannot be
# pinned, and this is the exact corner that cost a field bug on the other engine.
# The probe therefore ASSERTS the run against the recorded verdict in
# `docs/spikes/macos-wkwebview-renderer-backend/expected.json` and goes red
# naming the field that moved. `workflow_dispatch` is the on-demand entry point;
# the path filter re-runs it whenever the backend, the probe or the recorded
# verdict changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/macos-renderer/**"
      - "crates/werust-macos/**"
      # The SHARED painter half the AppKit window paints from (extracted out of
      # `werust-macos::paint` by task `windows-win32-window-and-chrome`, so the
      # Win32 window consumes the one carrier). A change to it changes what this
      # window shows.
      - "crates/desktop-paint/**"
      - "crates/macos-origin-probe/**"
      - "crates/webview-shared/**"
      - "crates/renderer/**"
      - "crates/werust-core/**"
      - "crates/fetcher/**"
      - "docs/spikes/macos-wkwebview-renderer-backend/**"
      - "docs/spikes/macos-appkit-window-and-chrome/**"
      - ".github/workflows/macos-renderer.yml"
  # NARROWER than the push filter above, deliberately, and pinned EXACTLY by
  # `the_pull_request_filter_is_the_pinned_exact_set_and_push_carries_the_rest`
  # in `crates/macos-renderer/tests/macos_backend_shape.rs`: this list is the one
  # the paragraphs below describe, and neither can move without the other going
  # red. It carries what is genuinely macOS-shaped, plus the SHARED painter and
  # the SPIKE DOCS paths (task `macos-spike-doc-accuracy-and-harness-guard`,
  # item 2): the RECORDED VERDICT -- `expected.json` and the verbatim run it is
  # stamped from -- lives in the spike directory, so re-recording it after a
  # deliberate re-decision is exactly the pull request that most needs WebKit
  # re-measured against it, which is what the header above PROMISES happens. That
  # claim and this list are also held together by
  # `the_readme_claim_about_when_the_leg_runs_matches_the_pull_request_trigger`.
  #
  # WHAT STAYS PUSH-ONLY, AND WHY (the deliberate trade-off). `crates/renderer/**`,
  # `crates/fetcher/**` and `crates/werust-core/**` are the wider DEPENDENCY
  # surface. A change to them can break this leg, but gating every such pull
  # request on `macos-14` minutes is a cost with no matching benefit: the leg
  # would gate most core work in this repo, and a red cross-platform leg would
  # block a change that has nothing to do with macOS. Watching them on `push` to
  # `main` finds the breakage minutes after it merges, on a leg that gates
  # nothing, and `workflow_dispatch` covers the deliberate case. That is exactly
  # the trade the sibling `windows-renderer.yml` header states, and this leg now
  # gives the same answer to the same question.
  #
  # `crates/werust-core/**` was on this filter from the day the leg landed and was
  # REMOVED by task `macos-harness-guard-teeth-and-paint-path-residue`, which
  # answered the open question the previous task deliberately left standing: two
  # desktop legs disagreeing about whether a core PR is macOS-shaped is a
  # difference nobody could act on, and the cost was the one the human flagged.
  pull_request:
    paths:
      - "crates/macos-renderer/**"
      - "crates/werust-macos/**"
      # KEPT here deliberately (task
      # `windows-backend-error-mapping-and-leg-header-accuracy`), not inherited:
      # it arrived on BOTH desktop legs' PR filters with
      # `windows-win32-window-and-chrome` with nothing pinning it. A break in the
      # ONE carrier both native windows paint from really is cross-platform, and
      # each leg's window smoke is what catches it, so both keep it, and both
      # now pin it (`macos_backend_shape.rs` here,
      # `crates/werust-core/tests/windows_renderer_leg_shape.rs` there).
      - "crates/desktop-paint/**"
      - "crates/macos-origin-probe/**"
      - "crates/webview-shared/**"
      - "docs/spikes/macos-wkwebview-renderer-backend/**"
      - "docs/spikes/macos-appkit-window-and-chrome/**"
      - ".github/workflows/macos-renderer.yml"

permissions:
  contents: read

jobs:
  macos-engine:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record what this run measured on
        # A platform result without its platform version is not a result.
        run: |
          sw_vers
          xcodebuild -version || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-macos-renderer-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-macos-renderer-cargo-

      - name: Build the macOS backend, the window and the origin probe
        # Only the macOS crates: the rest of the workspace (the `werust` binary,
        # `webview-renderer`) is GTK/WebKitGTK-bound and does not build here.
        # This is the step that compiles the `#[cfg(target_os = "macos")]`
        # Objective-C wiring the Ubuntu gate can only parse -- the engine's, and
        # now the AppKit window's.
        run: cargo build -p macos-renderer -p werust-macos -p macos-origin-probe

      - name: Test the macOS crates and the shared toolkit-free half
        # `webview-shared` is included deliberately: the load lifecycle and the
        # off-thread `ipfs://` boundary were MOVED there out of the WebKitGTK
        # crate, so they must pass on macOS too, not just on the Ubuntu gate.
        # `werust-macos` brings its shape guard, and `desktop-paint` -- the SHARED
        # painter half it now consumes -- brings the paint unit tests, which must
        # pass on macOS too and not only on the Ubuntu gate.
        run: cargo test -p macos-renderer -p werust-macos -p desktop-paint -p macos-origin-probe -p webview-shared

      - name: Exercise BOTH trust hooks on a real WKWebView (with a negative control)
        # A backend qualifies on the trust hooks, not on rendering. This loads a
        # hash-verified `ipfs://<cid>` page through the production verifying
        # resolver (pinned in memory: no gateway, no network), asserts the page
        # sees the native EIP-1193 provider and round-trips a request, then
        # asserts a tampered CID FAILS the load and is never reported verified.
        run: cargo run -p macos-renderer --example trust_hooks_smoke

      - name: Build and drive the REAL AppKit window (chrome, menu, debug view, shortcuts)
        # The window half's only execution anywhere: it opens a real `NSWindow`
        # FAR off-screen (accessory app: no Dock icon, no focus stolen), loads a
        # pinned, in-memory hash-verified `ipfs://` page through the production
        # verifying route, and asserts what the real widgets hold -- the URL bar,
        # the trust indicator and its explanation, the status line, the ⋮ menu
        # built from the core's `BrowserMenu`, and the debug view catching the
        # page's own `console.log`. Then a negative control (bytes that do not
        # hash to their CID) must FAIL, raise the error banner and displace the
        # page. Offline and deterministic.
        #
        # It also PRESSES the conventional shortcuts as real `NSEvent`s through
        # the real window's `sendEvent:` (task
        # `shortcuts-and-mouse-history-buttons-on-the-macos-edge`): Cmd+L, Cmd+R,
        # Escape in both focus contexts, the mouse's side buttons, and Ctrl+L as
        # the negative control that keeps "Cmd works" from being free. That is the
        # only place a werust chord is ever pressed on a Mac -- nobody on this
        # project has one -- while the translation table behind it is unit-tested
        # on every Ubuntu gate run (`crates/werust-macos/src/input.rs`).
        run: cargo run -p werust-macos --example window_smoke

      - name: Measure the WKURLSchemeHandler origin behaviour and assert the recorded verdict
        run: >
          cargo run -p macos-origin-probe --
          --expected docs/spikes/macos-wkwebview-renderer-backend/expected.json
          --out macos-origin-probe-report.json

      - name: Upload the measured origin report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-origin-probe-report
          path: macos-origin-probe-report.json
          if-no-files-found: warn
