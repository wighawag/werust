[package]
name = "werust-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renderer = { path = "../renderer" }
fetcher = { path = "../fetcher" }
serde_json = "1"
# keccak256 for the ENS `namehash` (ENSIP-1) and the function selectors ENS
# resolution ABI-encodes. `sha3::Keccak256` is the LEGACY Keccak variant
# Ethereum uses (NOT NIST SHA3-256), from the same vetted RustCrypto family as
# `fetcher`'s `sha2`/`digest` (`digest 0.10`) — a BOUND primitive, never a
# hand-rolled hash (`CONTEXT.md` / `docs/adr/0001`: bind vetted crypto).
sha3 = "0.10"
# ENSIP-1/ENSIP-15 name normalization for `namehash`. A Rust port of adraffy's
# reference ENS normalizer, returning a `Result` so an unnormalizable name is a
# distinct fail-closed error rather than a silently-mangled label — bound, not
# hand-rolled Unicode normalization. See the `ens` module's normalization
# decision in `docs/spikes/ens-namehash-registry-resolver-contenthash-resolution/`.
ens-normalize = "0.1.1"
# The bound HTTP+TLS stack the `RpcProvider` backend's own minimal synchronous
# JSON-RPC POST transport binds (the `ethereum` module's `UreqRpcTransport`).
# A JSON-RPC `eth_call` is a POST with a JSON body, which the GET-only `Fetcher`
# seam cannot express, so this backend binds `ureq`'s POST behind its own
# `RpcTransport` seam (bound, not hand-rolled) rather than widening the shared
# `Fetcher` seam. Same vetted rustls-backed client the `fetcher` crate binds;
# TLS is NEVER hand-written. Pinned to match the repo's exact-version style.
ureq = "=3.3.0"

[dev-dependencies]
# Parses the release-plumbing config files (`.goreleaser.yaml` +
# `.github/workflows/release.yml`) for the shape test in
# `tests/release_plumbing_shape.rs`. Dev-only: it never enters the shipped
# binary, only `cargo test` (the verify gate).
serde_yaml = "0.9"
# Parses the checked-in platform-capability parity matrix
# (`docs/platform-capability-matrix.toml`) for the parity guard in
# `tests/platform_capability_parity.rs`. Dev-only, like `serde_yaml` above: it
# never enters the shipped binary, only `cargo test` (the verify gate).
toml = "1"
